<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LIMATCO · Acopios</title>
<meta name="description" content="Control de pallets de Acopio 1 y 2: consulta, entradas, salidas, traslados, mapa de ocupación y etiquetas QR.">
<meta name="theme-color" content="#0B100E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Acopios">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* ============================ TOKENS ============================ */
:root{
  --bg:#0B100E; --bg2:#0E1512; --s1:#121A16; --s2:#17211C; --s3:#1E2A24; --line:#24322B; --line2:#32443A;
  --tx:#E9F2ED; --tx2:#B6C6BD; --mut:#7D9288;
  --brand:#41C68E; --brand2:#2FA474; --brand-deep:#356854; --ink:#04140D;
  --amber:#F4B740; --red:#FF5F57; --blue:#58A6FF; --violet:#B08CFF; --teal:#2DD4BF;
  --st-libre:#41C68E; --st-parcial:#58A6FF; --st-llena:#F4B740; --st-exc:#FF5F57; --st-ocup:#71857B; --st-inact:#3A4740;
  --r:16px; --r2:11px; --r3:8px;
  --sh:0 18px 40px rgba(0,0,0,.45);
  --f-t:'Space Grotesk',system-ui,sans-serif; --f-x:'Inter',system-ui,-apple-system,sans-serif; --f-m:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --top-h:58px; --nav-h:68px; --rail-w:224px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--tx);font:15px/1.45 var(--f-x);background:var(--bg);
  background-image:
    linear-gradient(rgba(65,198,142,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(65,198,142,.035) 1px,transparent 1px),
    radial-gradient(1200px 600px at 85% -10%,rgba(53,104,84,.28),transparent 60%);
  background-size:44px 44px,44px 44px,auto;background-attachment:fixed;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none!important}
a{color:var(--brand)}
.ic{display:inline-block;vertical-align:middle;flex:none}
.code{font-family:var(--f-m);font-weight:700;letter-spacing:.01em}
.mono{font-family:var(--f-m)}
.mut{color:var(--mut)}
.hl{color:var(--brand)}
.nowrap{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============================ LOGIN ============================ */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login-card{width:100%;max-width:400px;background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:22px;padding:30px 24px;box-shadow:var(--sh);position:relative;overflow:hidden}
.login-card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:repeating-linear-gradient(90deg,var(--brand) 0 22px,var(--brand-deep) 22px 44px)}
.wordmark{font:700 34px/1 var(--f-t);letter-spacing:.04em}
.wordmark small{display:block;font:600 12px/1 var(--f-m);letter-spacing:.32em;color:var(--brand);margin-top:8px}
.login-card p{margin:10px 0 22px}
.login-card form{display:grid;gap:14px}
.err{color:var(--red);min-height:1.3em;margin:0;font-size:14px}
.demo-hint{margin:18px 0 0!important;padding:10px 12px;border:1px dashed var(--line2);border-radius:var(--r2);font-size:13px;color:var(--tx2)}
.login-foot{margin-top:18px;font:600 11px var(--f-m);letter-spacing:.2em;color:var(--mut);text-align:center}

/* ============================ SHELL ============================ */
.topbar{position:fixed;inset:0 0 auto 0;height:calc(var(--top-h) + var(--safe-t));padding:var(--safe-t) 14px 0;display:flex;align-items:center;gap:10px;z-index:40;
  background:rgba(11,16,14,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;font:700 19px/1 var(--f-t);letter-spacing:.05em}
.brand small{font:700 10px var(--f-m);letter-spacing:.28em;color:var(--brand)}
.brand .tiles{display:inline-grid;grid-template-columns:repeat(2,7px);gap:2px;margin-right:2px;align-self:center}
.brand .tiles i{width:7px;height:7px;border-radius:1.5px;background:var(--brand)}
.brand .tiles i:nth-child(2),.brand .tiles i:nth-child(3){background:var(--brand-deep)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill-sync{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);font:600 12px var(--f-m);color:var(--tx2)}
.pill-sync i{width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px rgba(65,198,142,.18)}
.pill-sync.warn i{background:var(--amber);box-shadow:0 0 0 3px rgba(244,183,64,.18)}
.pill-sync.off i{background:var(--red);box-shadow:0 0 0 3px rgba(255,95,87,.18)}
.pill-sync.busy i{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--brand-deep);color:#fff;font:700 13px var(--f-t);display:grid;place-items:center;border:2px solid var(--line2)}
.demo-banner{position:fixed;top:calc(var(--top-h) + var(--safe-t));left:0;right:0;z-index:39;text-align:center;font:700 11px var(--f-m);letter-spacing:.18em;padding:4px;background:repeating-linear-gradient(45deg,#3a2d0b 0 10px,#2b2208 10px 20px);color:var(--amber);border-bottom:1px solid #4a3a10}
body.demo main{padding-top:calc(var(--top-h) + var(--safe-t) + 40px)}

.nav{position:fixed;z-index:40;background:rgba(14,21,18,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.nav button{display:flex;align-items:center;gap:12px;color:var(--mut);font-weight:600;position:relative}
.nav button.on{color:var(--tx)}
.nav .badge-n{position:absolute;top:4px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--amber);color:var(--ink);font:800 11px/18px var(--f-m);text-align:center}
main{padding:calc(var(--top-h) + var(--safe-t) + 18px) 16px calc(var(--nav-h) + var(--safe-b) + 28px)}
.view{max-width:1180px;margin:0 auto}

@media (max-width:899px){
  .nav{left:0;right:0;bottom:0;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line)}
  .nav button{flex-direction:column;justify-content:center;gap:4px;font-size:11px;letter-spacing:.02em}
  .nav button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
  .nav .solo-desk{display:none}
}
@media (min-width:900px){
  .nav{top:calc(var(--top-h) + var(--safe-t));bottom:0;left:0;width:var(--rail-w);padding:18px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
  .nav button{height:46px;padding:0 14px;border-radius:12px;font-size:14.5px}
  .nav button:hover{background:var(--s2);color:var(--tx)}
  .nav button.on{background:var(--s3);color:var(--tx);box-shadow:inset 3px 0 0 var(--brand)}
  .nav .solo-movil{display:none}
  .nav .badge-n{position:static;margin-left:auto}
  main{padding-left:calc(var(--rail-w) + 28px);padding-right:28px;padding-bottom:40px}
  .demo-banner{left:var(--rail-w)}
}

/* ============================ TIPOGRAFÍA / CABECERAS ============================ */
.h1{font:700 clamp(26px,4.6vw,40px)/1.04 var(--f-t);letter-spacing:-.02em;margin:0}
.h2{font:700 18px/1.2 var(--f-t);margin:0}
.sub{color:var(--tx2);margin:8px 0 0;max-width:62ch}
.vh{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin:4px 0 18px}
.eyebrow{font:700 11px var(--f-m);letter-spacing:.2em;color:var(--brand);text-transform:uppercase}

/* ============================ BOTONES / CAMPOS ============================ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;background:var(--s3);border:1px solid var(--line2);font-weight:600;white-space:nowrap;transition:transform .08s,background .15s}
.btn:hover{background:#243329}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--ink)}
.btn-primary:hover{background:#56d39f}
.btn-danger{background:transparent;border-color:rgba(255,95,87,.5);color:var(--red)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--tx2)}
.btn-ghost:hover{background:var(--s2)}
.btn-sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn-lg{height:52px;padding:0 20px;font-size:16px}
.btn-xl{height:60px;padding:0 22px;font-size:17px;border-radius:15px;width:100%;font-family:var(--f-t);letter-spacing:.01em}
.btn.busy{pointer-events:none;opacity:.7}
.btn.busy::after{content:"";width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--tx2);background:var(--s2);border:1px solid var(--line)}
.btn-icon:hover{color:var(--tx);background:var(--s3)}
.field{display:grid;gap:6px;font-size:12.5px;font-weight:600;color:var(--tx2);letter-spacing:.02em}
.field>span{display:flex;justify-content:space-between;gap:6px}
input,select,textarea{width:100%;min-height:48px;padding:0 14px;border-radius:12px;background:var(--bg2);border:1px solid var(--line2);font-size:16px;font-weight:500;color:var(--tx);outline:none;transition:border .15s,box-shadow .15s}
textarea{padding:12px 14px;min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(65,198,142,.18)}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--brand);padding:0}
input[type=date]{color-scheme:dark}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.inp-big{font:700 24px var(--f-m);height:58px;text-align:center}
.row2,.row3,.row4{display:grid;gap:12px}
@media (min-width:620px){.row2{grid-template-columns:1fr 1fr}.row3{grid-template-columns:repeat(3,1fr)}.row4{grid-template-columns:repeat(4,1fr)}}
.stack{display:grid;gap:14px}
.acts{display:flex;flex-wrap:wrap;gap:10px}

/* segmentado y chips */
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line2);border-radius:13px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{height:40px;padding:0 14px;border-radius:9px;font-weight:600;color:var(--tx2);font-size:14px}
.seg button.on{background:var(--brand);color:var(--ink)}
.seg.big button{height:46px;padding:0 20px;font:700 15px var(--f-t)}
.seg.full{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr))}.seg.full button{padding:0 6px;font-size:13.5px;letter-spacing:.01em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 13px;border-radius:99px;border:1px solid var(--line2);background:var(--s1);color:var(--tx2);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px}
.chip.on{border-color:var(--brand);color:var(--tx);background:rgba(65,198,142,.12)}
.chip b{font-family:var(--f-m);color:var(--tx)}
.chip .dot{width:9px;height:9px;border-radius:3px}

/* ============================ TARJETAS / KPI ============================ */
.card{background:linear-gradient(180deg,var(--s1),rgba(18,26,22,.75));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.kgrid{display:grid;gap:10px;margin:0 0 14px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.kgrid.k4{grid-template-columns:repeat(4,1fr)}.kgrid.k3{grid-template-columns:repeat(3,1fr)}.kgrid.k6{grid-template-columns:repeat(6,1fr)}}
@media (min-width:520px) and (max-width:759px){.kgrid.k6,.kgrid.k3{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:13px 14px 12px;position:relative;overflow:hidden;min-width:0}
.kpi .k-l{font:700 10.5px var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-v{font:800 clamp(22px,3.2vw,30px)/1.1 var(--f-m);margin-top:6px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .k-v small{font-size:.5em;color:var(--tx2);font-weight:700;margin-left:4px}
.kpi .k-s{font-size:12.5px;color:var(--tx2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.acc{border-color:rgba(65,198,142,.45);background:linear-gradient(160deg,rgba(65,198,142,.16),var(--s1) 70%)}
.kpi.warn{border-color:rgba(244,183,64,.5);background:linear-gradient(160deg,rgba(244,183,64,.13),var(--s1) 70%)}
.kpi.bad{border-color:rgba(255,95,87,.5);background:linear-gradient(160deg,rgba(255,95,87,.13),var(--s1) 70%)}
.kpi .bar{height:5px;border-radius:3px;background:var(--s3);margin-top:9px;overflow:hidden}
.kpi .bar i{display:block;height:100%;background:var(--brand);border-radius:3px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:rgba(88,166,255,.08);border:1px solid rgba(88,166,255,.3);color:var(--tx2);font-size:14px;margin:0 0 14px}
.note.warn{background:rgba(244,183,64,.08);border-color:rgba(244,183,64,.38)}
.note.bad{background:rgba(255,95,87,.08);border-color:rgba(255,95,87,.4)}
.note b{color:var(--tx)}
.empty{padding:28px 16px;text-align:center;color:var(--mut);border:1px dashed var(--line2);border-radius:14px}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font:800 10.5px var(--f-m);letter-spacing:.06em;white-space:nowrap}
.b-ent{background:rgba(65,198,142,.16);color:var(--brand)}
.b-sal{background:rgba(244,183,64,.16);color:var(--amber)}
.b-par{background:rgba(244,183,64,.08);color:#f7cd78;border:1px dashed rgba(244,183,64,.5)}
.b-tra{background:rgba(88,166,255,.16);color:var(--blue)}
.b-aju{background:rgba(176,140,255,.16);color:var(--violet)}
.b-ini{background:var(--s3);color:var(--tx2)}
.b-pend{background:rgba(244,183,64,.16);color:var(--amber)}
.b-un{background:rgba(45,212,191,.14);color:var(--teal)}

/* ============================ BUSCAR ============================ */
.hero{margin:6px 0 16px}
.searchbox{display:flex;align-items:center;gap:10px;margin-top:16px;background:var(--s1);border:1.5px solid var(--line2);border-radius:18px;padding:6px 6px 6px 16px;transition:border .15s,box-shadow .15s}
.searchbox:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px rgba(65,198,142,.15)}
.searchbox>.ic{color:var(--mut)}
.searchbox input{border:0;background:transparent;box-shadow:none;height:54px;font-size:18px;padding:0 4px}
.searchbox input:focus{box-shadow:none}
.searchbox.sm{margin:0;border-radius:13px;padding:2px 4px 2px 12px}
.searchbox.sm input{height:40px;font-size:15px}
.btn-scan{height:54px;border-radius:13px;padding:0 18px}
@media (max-width:520px){.btn-scan span{display:none}.btn-scan{width:54px;padding:0}}
.res{display:grid;gap:8px}
.ri{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:14px;background:var(--s1);border:1px solid var(--line);transition:border .12s,background .12s}
.ri:hover{border-color:var(--line2);background:var(--s2)}
.ri-main{min-width:0;flex:1;display:grid;gap:3px}
.ri-main .code{font-size:16px}
.ri-d{color:var(--tx2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-side{text-align:right;display:grid;gap:2px;flex:none}
.ri-side b{font:800 16px var(--f-m)}
.ri-side small{color:var(--tx2);font-size:12.5px}
.sec-t{font:700 11px var(--f-m);letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin:18px 2px 10px}

/* FICHA */
.ficha-h{display:flex;gap:14px;align-items:flex-start;margin:0 0 16px}
.ficha-h .code{font-size:clamp(28px,6vw,44px);line-height:1;display:block}
.ficha-h .desc{font:600 17px/1.3 var(--f-t);margin-top:8px;color:var(--tx)}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--tx2);font-size:13.5px;margin-top:8px}
.meta b{color:var(--tx);font-family:var(--f-m)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font:700 10.5px var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--f-m);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tfoot td{font-weight:700;border-top:1px solid var(--line2)}
.tbl-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
.ubloc{border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden}
.ubloc-h{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--s2)}
.ubloc-h .code{font-size:17px}
.ubloc-h .st{margin-left:auto}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-top:1px solid var(--line)}
.prow:hover{background:var(--s2)}
.prow .code{font-size:13.5px;color:var(--brand)}
.prow .pm{font-size:13.5px;color:var(--tx2)}
.prow .pr{font:700 14px var(--f-m);text-align:right}
.prow .pr small{display:block;font:500 11.5px var(--f-x);color:var(--mut)}
.chart-box{position:relative;height:240px}
.chart-box.tall{height:320px}
.chart-box.xtall{height:380px}

/* ============================ FORMULARIOS DE OPERACIÓN ============================ */
.paso{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.paso i{width:28px;height:28px;border-radius:9px;background:var(--brand-deep);display:grid;place-items:center;font:800 13px var(--f-m);font-style:normal}
.prod-card{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:13px;background:var(--bg2);border:1px solid var(--line2);margin-top:10px}
.prod-card .code{font-size:18px}
.ac{position:relative}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:var(--s2);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--sh);max-height:320px;overflow:auto}
.ac-list button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
.ac-list button:hover,.ac-list button.sel{background:var(--s3)}
.ac-list .code{flex:none}
.ac-list span{color:var(--tx2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--s3);border:1px solid var(--line2);font:700 20px var(--f-m)}
.stepper input{width:84px;text-align:center;font:700 18px var(--f-m);padding:0 6px}

<script>
'use strict';
/* =====================================================================
 * LIMATCO · CONTROL DE ACOPIOS — PWA
 * Desarrollado por ISI LABS
 * Frontend de archivo único: HTML + CSS + JS. Backend: Google Apps Script (Code.gs) + Google Sheets.
 * ===================================================================== */

// ============================ CONFIGURACIÓN ============================
const CONFIG = {
  // URL /exec de la Web App de Apps Script. Vacía = MODO DEMO (datos de prueba locales).
  API_URL: '',
  SAL: 'limatco-acopios',          // debe coincidir con CFG.SAL de Code.gs
  VERSION: '1.0.0',
  TIMEOUT_MS: 45000,

  DIAS_HISTORIAL: 90,
  DESTINOS: ['PICKING', 'DESPACHO', 'FLETE', 'OTRO'],
  CDN: {
    CHART: 'https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js',
    DATALABELS: 'https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js',
    SCANNER: 'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js',
    XLSX: 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
  },
  COLORES: { ENTRADA: '#41C68E', SALIDA: '#F4B740', TRASLADO: '#58A6FF', AJUSTE: '#B08CFF', MUT: '#71857B' },
};
const DEMO = !CONFIG.API_URL || new URLSearchParams(location.search).has('demo');
const ROLES = { CONSULTA: 1, OPERADOR: 2, SUPERVISOR: 3, ADMIN: 4 };
const TZ = 'America/Santiago';
const DIA = 86400000;

// ============================ UTILIDADES ============================
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s ?? '').trim().toUpperCase();
const sinTildes = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '');
const num = v => { if (typeof v === 'number') return isFinite(v) ? v : 0; const s = String(v ?? '').trim().replace(',', '.'); const n = parseFloat(s); return isFinite(n) ? n : 0; };
const r2 = n => Math.round((+n || 0) * 100) / 100;
const nf0 = new Intl.NumberFormat('es-CL', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('es-CL', { maximumFractionDigits: 1 });
const nf2 = new Intl.NumberFormat('es-CL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtN = (n, d = 0) => (d === 2 ? nf2 : d === 1 ? nf1 : nf0).format(+n || 0);
const fmtCant = (n, unidad) => unidad === 'UN' ? `${fmtN(n)} un` : `${fmtN(n, 2)} m²`;
const dtf = o => new Intl.DateTimeFormat('es-CL', Object.assign({ timeZone: TZ }, o));
const F_FH = dtf({ day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
const F_F = dtf({ day: '2-digit', month: '2-digit', year: 'numeric' });
const F_DM = dtf({ day: '2-digit', month: '2-digit' });
const F_H = dtf({ hour: '2-digit', minute: '2-digit', hour12: false });
const F_KEY = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
const F_HORA = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour: '2-digit', hour12: false });
const fFH = ms => ms ? F_FH.format(new Date(ms)).replace(',', '') : '—';
const fF = ms => ms ? F_F.format(new Date(ms)) : '—';
const fDM = ms => ms ? F_DM.format(new Date(ms)) : '—';
const fH = ms => ms ? F_H.format(new Date(ms)) : '';
const diaKey = ms => F_KEY.format(new Date(ms));

async function sha256(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}

/** Normaliza una ubicación igual que el servidor: a8 → A-08, A-34,2 → A-34.2 */
function normUbic(raw) {
  const s = norm(raw).replace(/\s+/g, '');
  if (!s) return '';
  let m = s.match(/^([A-Z])-?0*(\d{1,3})$/);
  if (m) return `${m[1]}-${String(parseInt(m[2], 10)).padStart(2, '0')}`;
  m = s.match(/^([A-Z])-?0*(\d{1,3})[,.](\d{1,2})$/);
  if (m) return `${m[1]}-${String(parseInt(m[2], 10)).padStart(2, '0')}.${m[3]}`;
  return s;
}
function partesUbic(u) { const m = String(u).match(/^([A-Z]+)-(\d+)(?:\.(\d+))?$/); return m ? { pasillo: m[1], numero: parseFloat(m[2] + (m[3] ? '.' + m[3] : '')) } : { pasillo: String(u), numero: 0 }; }
const etiquetaCelda = u => { const m = String(u.ubic).match(/^[A-Z]+-(.+)$/); return m ? m[1] : u.ubic; };

}

function ordenarUbic() {
  const esp = u => (u.tipo === 'POSICION' ? 0 : 1);
  S.ubic.sort((a, b) => a.acopio.localeCompare(b.acopio) || esp(a) - esp(b) || a.pasillo.localeCompare(b.pasillo) || a.numero - b.numero || a.ubic.localeCompare(b.ubic));
}

function reindexar() {
  const I = S.idx;
  I.porId.clear(); I.porCodigo.clear(); I.porUbic.clear(); I.ubic.clear();
  for (const u of S.ubic) I.ubic.set(ubicKey(u.acopio, u.ubic), u);
  for (const p of S.pallets) {
    I.porId.set(p.id, p);
    if (!I.porCodigo.has(p.codigo)) I.porCodigo.set(p.codigo, []);
    I.porCodigo.get(p.codigo).push(p);
    const k = ubicKey(p.acopio, p.ubic);
    if (!I.porUbic.has(k)) I.porUbic.set(k, []);
    I.porUbic.get(k).push(p);
    if (!I.ubic.has(k)) { // ubicación referenciada que no está en el maestro
      const pt = partesUbic(p.ubic);
      const u = { acopio: p.acopio, ubic: p.ubic, pasillo: pt.pasillo, numero: pt.numero, cap: null, tipo: 'POSICION', activa: true, obs: 'No está en el maestro de ubicaciones', virtual: true };
      S.ubic.push(u); I.ubic.set(k, u);
    }
  }
}

function estadoUbic(u) {
  const n = (S.idx.porUbic.get(ubicKey(u.acopio, u.ubic)) || []).length;
  const cap = u.cap || null;
  let st;
  if (!u.activa) st = 'inactiva';
  else if (n === 0) st = 'libre';
  else if (!cap) st = 'ocupada';
  else if (n < cap) st = 'parcial';
  else if (n === cap) st = 'llena';
  else st = 'excedida';
  return { n, cap, st, libres: cap ? Math.max(0, cap - n) : (n === 0 ? Infinity : 0) };
}
const ST_TXT = { libre: 'Libre', parcial: 'Con espacio', llena: 'Llena', excedida: 'Sobre capacidad', ocupada: 'Ocupada (sin capacidad)', inactiva: 'Inactiva' };

function infoProd(codigo) {
  const c = norm(codigo);
  const p = S.prod.get(c);
  if (p) return { c, d: p.d, r: p.r, u: p.u, app: !!p.a };
  const ps = S.idx.porCodigo.get(c);
  if (ps && ps.length) return { c, d: ps[0].desc, r: ps[0].rend, u: ps[0].unidad, app: false };
  return null;
}

function resumenCodigo(codigo) {
  const ps = S.idx.porCodigo.get(codigo) || [];
  const R = { pallets: ps.length, cajas: 0, cant: 0, unidad: ps[0] ? ps[0].unidad : 'M2', ac: { '1': { pallets: 0, cajas: 0, cant: 0 }, '2': { pallets: 0, cajas: 0, cant: 0 } } };
  for (const p of ps) {
    const cant = p.unidad === 'UN' ? p.cajas : p.mts;
    R.cajas += p.cajas; R.cant += cant;
    const a = R.ac[p.acopio] || (R.ac[p.acopio] = { pallets: 0, cajas: 0, cant: 0 });
    a.pallets++; a.cajas += p.cajas; a.cant += cant;
  }
  return R;
}

function totales() {
  const t = { pallets: S.pallets.length, m2: 0, un: 0, codigos: S.idx.porCodigo.size };
  for (const p of S.pallets) { if (p.unidad === 'UN') t.un += p.cajas; else t.m2 += p.mts; }
  return t;
}

function statsAcopio(a) {
  const pos = S.ubic.filter(u => u.acopio === a && u.tipo === 'POSICION' && u.activa);
  const s = { pos: pos.length, libres: 0, ocup: 0, pallets: 0, m2: 0, conCap: 0, capTot: 0, palletsConCap: 0, sinCap: 0, exc: 0, llenas: 0, parciales: 0 };
  for (const u of pos) {
    const e = estadoUbic(u);
    if (e.n === 0) s.libres++; else s.ocup++;
    if (u.cap) { s.conCap++; s.capTot += u.cap; s.palletsConCap += e.n; } else s.sinCap++;
    if (e.st === 'excedida') s.exc++;
    if (e.st === 'llena') s.llenas++;
    if (e.st === 'parcial') s.parciales++;
  }
  for (const p of S.pallets) if (p.acopio === a) { s.pallets++; if (p.unidad !== 'UN') s.m2 += p.mts; }
  if (s.conCap && !s.sinCap) { s.pct = Math.round(100 * s.palletsConCap / s.capTot); s.base = `${fmtN(s.palletsConCap)} / ${fmtN(s.capTot)} pallets`; }
  else { s.pct = s.pos ? Math.round(100 * s.ocup / s.pos) : 0; s.base = `${s.ocup} de ${s.pos} posiciones`; }
  return s;
}

const ENCOLABLES = new Set(['entrada', 'salida', 'traslado']);

async function api(accion, datos = {}) {
  const req = Object.assign({ accion, token: S.token }, datos);
  if (DEMO) return Demo.despachar(JSON.parse(JSON.stringify(req)));
  const ctrl = new AbortController();
  const tm = setTimeout(() => ctrl.abort(), CONFIG.TIMEOUT_MS);
  let txt;
  try {
    const r = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(req), signal: ctrl.signal }); // text/plain: sin preflight CORS
    txt = await r.text();
  } catch (e) {
    const err = new Error(navigator.onLine ? 'El servidor no respondió a tiempo' : 'Sin conexión a internet');
    err.red = true; throw err;
  } finally { clearTimeout(tm); }
  let j;
  try { j = JSON.parse(txt); } catch (e) { throw new Error('Respuesta inesperada del servidor. Revisa la URL de Apps Script y que la implementación tenga acceso “Cualquier usuario”.'); }
  if (j && !j.ok && j.code === 'AUTH' && accion !== 'login') sesionExpirada();
  return j;
}

/** Ejecuta una operación de escritura. Si no hay red y es encolable, la guarda y la aplica en local. */
async function operar(accion, datos) {
  datos.opId = datos.opId || uid();
  try {
    return await api(accion, datos);
  } catch (e) {
    if (e.red && ENCOLABLES.has(accion)) {
      S.outbox.push({ opId: datos.opId, accion, datos: JSON.parse(JSON.stringify(datos)), ts: Date.now(), error: '' });
      guardarOutbox();
      aplicarOptimista(accion, datos); reindexar();
      return { ok: true, encolado: true };
    }
    throw e;
  }
}
const guardarOutbox = () => { store.set('lim_outbox', S.outbox); pintarSync(); pintarNav(); };

function aplicarOptimista(accion, d) {
  if (accion === 'salida') {
    for (const it of d.items) {
      const i = S.pallets.findIndex(p => p.id === it.id);
      if (i < 0) continue;
      const p = S.pallets[i];
      const cs = it.cajas == null ? p.cajas : num(it.cajas);
      if (cs >= p.cajas) S.pallets.splice(i, 1);
      else { p.cajas = r2(p.cajas - cs); p.mts = r2(p.cajas * p.rend); p.pend = true; }
    }
  } else if (accion === 'traslado') {
    for (const id of d.ids) { const p = S.pallets.find(x => x.id === id); if (p) { p.acopio = d.acopio; p.ubic = normUbic(d.ubicacion); p.pend = true; } }
  } else if (accion === 'entrada') {
    const info = infoProd(d.codigo) || { d: (d.producto && d.producto.descripcion) || '', r: num(d.producto && d.producto.rendimiento), u: (d.producto && d.producto.unidad) || 'M2' };
    for (let k = 0; k < d.pallets; k++) {
      S.pallets.push({ id: `TMP-${d.opId.slice(0, 4).toUpperCase()}-${k + 1}`, codigo: norm(d.codigo), desc: info.d, unidad: info.u, rend: info.u === 'UN' ? 0 : info.r,
        cajasIni: num(d.cajas), cajas: num(d.cajas), mts: r2(num(d.cajas) * (info.u === 'UN' ? 0 : info.r)), tono: norm(d.tono), calibre: norm(d.calibre),
        acopio: d.acopio, ubic: normUbic(d.ubicacion), fIngreso: Date.now(), uIngreso: S.user ? S.user.usuario : '', pend: true, tmp: true });
    }
  }
}

let _sincronizando = false;
async function sincronizar(manual = false) {
  if (_sincronizando || !S.token) return;
  const pendientes = S.outbox.filter(o => !o.error);
  if (!pendientes.length) { if (manual) toast('No hay operaciones pendientes'); return; }
  _sincronizando = true; pintarSync();
  let hechos = 0, red = false;
  try {
    for (const op of pendientes) {
      try {
        const r = await api(op.accion, Object.assign({}, op.datos, { opId: op.opId }));
        if (r.ok) { S.outbox = S.outbox.filter(o => o.opId !== op.opId); hechos++; }
        else if (r.code === 'AUTH') break;
        else { op.error = r.error || 'Error'; op.code = r.code || ''; toast(`Pendiente rechazado (${op.accion}): ${op.error}`, 'err', 7000); }
      } catch (e) { if (e.red) { red = true; break; } op.error = e.message; }
    }
  } finally {
    _sincronizando = false; guardarOutbox();
  }
  if (hechos) { toast(`${hechos} operación(es) pendiente(s) sincronizada(s)`); await cargarDatos({ silencioso: true }); }
  else if (manual && red) toast('Sigue sin conexión con el servidor', 'warn');
}

async function cargarDatos({ silencioso = false } = {}) {
  if (S.cargando || !S.token) return false;
  S.cargando = true; pintarSync();
  try {
    const r = await api('bootstrap');
    if (!r.ok) { if (r.code !== 'AUTH') toast(r.error || 'No se pudo cargar', 'err'); return false; }
    S.user = r.usuario; store.set('lim_ses', { token: S.token, user: S.user });
    S.pallets = r.pallets; S.ubic = r.ubicaciones; S.erp = Object.assign({}, S.erp, r.erp); S.grueros = r.grueros || [];
    for (const o of S.outbox) if (!o.error) aplicarOptimista(o.accion, o.datos);
    ordenarUbic(); reindexar();
    S.ultimaCarga = Date.now();
    store.set('lim_cache', { t: S.ultimaCarga, pallets: r.pallets, ubic: r.ubicaciones, erp: S.erp, grueros: S.grueros });
    if (r.prodVer !== S.prodVer) cargarProductos(r.prodVer);
    pintarUsuario(); pintarNav();
    const escribiendo = document.activeElement && document.activeElement.matches('input,select,textarea') && document.activeElement.id !== 'q';
    if (!$('.backdrop') && !escribiendo && ['buscar', 'mapa', 'etiquetas', 'salida'].includes(S.vista)) renderVista();
    return true;
  } catch (e) {
    if (!silencioso) toast(e.message, e.red ? 'warn' : 'err', 5000);
    return false;
  } finally { S.cargando = false; pintarSync(); }
}

async function cargarProductos(ver) {
  const c = store.get('lim_prod');
  if (c && c.ver === ver && c.items) { setProductos(c.items, ver); return; }
  try {
    const r = await api('productos');
    if (!r.ok) return;
    setProductos(r.items, r.ver);
    if (!store.set('lim_prod', { ver: r.ver, items: r.items })) console.warn('Catálogo demasiado grande para localStorage: queda solo en memoria');
    if (S.vista === 'entrada') vEntrada();
  } catch (e) { /* se reintenta en la próxima carga */ }
}
function setProductos(items, ver) {
  S.prodVer = ver; S.prod = new Map();
  S.prodList = items.map(([c, d, r, u, a]) => { const o = { c, d, r: +r || 0, u: u || 'M2', a: a ? 1 : 0, k: sinTildes(`${c} ${d}`.toUpperCase()) }; S.prod.set(c, o); return o; });
}

/** Aplica la respuesta de una escritura al estado local. */
function aplicarResultado(r) {
  if (r.cerrados) S.pallets = S.pallets.filter(p => !r.cerrados.includes(p.id));
  for (const np of r.pallets || []) {
    const i = S.pallets.findIndex(p => p.id === np.id);
    if (i >= 0) S.pallets[i] = np; else S.pallets.push(np);
  }
  reindexar();
  store.set('lim_cache', { t: S.ultimaCarga, pallets: S.pallets.filter(p => !p.tmp), ubic: S.ubic.filter(u => !u.virtual), erp: S.erp, grueros: S.grueros });
}

function tokenVigente(t) {
  if (!t) return false;

      const ahora = Date.now(), orig = mover.map(p => ({ acopio: p.acopio, ubic: p.ubic }));
      for (const p of mover) {
        mov({ fecha: ahora, tipo: 'TRASLADO', pallet: p.id, codigo: p.codigo, desc: p.desc, unidad: p.unidad, cajas: p.cajas, mts: p.mts, tono: p.tono, calibre: p.calibre, acoOrig: p.acopio, ubiOrig: p.ubic, acoDest: d.a, ubiDest: d.ub, gruero: norm(req.gruero || u.nombre), usuario: u.usuario, obs: req.obs || '', op: req.opId });
        p.acopio = d.a; p.ubic = d.ub; p.ultMov = ahora;
      }
      return { ok: true, fecha: ahora, pallets: mover, liberadas: liberadas(orig) };
    },
    ajuste(req, u) {
      const p = db.pallets.find(x => x.id === norm(req.id)); if (!p) return err('El pallet no está en acopio.', 'NO_EXISTE');
      if (!String(req.motivo || '').trim()) throw new Error('Indica el motivo del ajuste.');
      const antes = p.cajas, nuevas = req.cajas === '' || req.cajas == null ? antes : num(req.cajas), cambios = [];
      if (nuevas < 0) throw new Error('Las cajas no pueden ser negativas.');
      if (nuevas !== antes) cambios.push(`cajas ${antes}→${nuevas}`);
      if (req.tono !== undefined && norm(req.tono) !== p.tono) { cambios.push(`tono ${p.tono || '—'}→${norm(req.tono) || '—'}`); p.tono = norm(req.tono); }
      if (req.calibre !== undefined && norm(req.calibre) !== p.calibre) { cambios.push(`calibre ${p.calibre || '—'}→${norm(req.calibre) || '—'}`); p.calibre = norm(req.calibre); }
      if (!cambios.length) return err('No hay cambios que registrar.', 'VALIDACION');
      const delta = r2(nuevas - antes), ahora = Date.now();
      mov({ fecha: ahora, tipo: 'AJUSTE', pallet: p.id, codigo: p.codigo, desc: p.desc, unidad: p.unidad, cajas: delta, mts: r2(delta * p.rend), tono: p.tono, calibre: p.calibre, acoOrig: p.acopio, ubiOrig: p.ubic, acoDest: p.acopio, ubiDest: p.ubic, usuario: u.usuario, obs: `${req.motivo} (${cambios.join(', ')})`, op: req.opId });
      p.cajas = nuevas; p.mts = r2(nuevas * p.rend); p.ultMov = ahora;
      if (nuevas === 0) { db.pallets = db.pallets.filter(x => x !== p); db.hist.push(Object.assign({}, p, { fechaCierre: ahora, motivoCierre: 'AJUSTE: ' + req.motivo })); return { ok: true, fecha: ahora, cerrados: [p.id], pallets: [], liberadas: liberadas([p]) }; }
      return { ok: true, fecha: ahora, cerrados: [], pallets: [p], liberadas: [] };
    },
    crearProducto(req) {
      const c = norm(req.codigo); if (!c) throw new Error('Falta el código.');
      if (CAT.some(p => p[0] === c) || EXTRA.some(p => p[0] === c)) return err(`El código ${c} ya existe en el maestro.`, 'EXISTE');
      const un = req.unidad === 'UN' ? 'UN' : 'M2', rend = un === 'UN' ? 0 : num(req.rendimiento);
      if (!String(req.descripcion || '').trim()) throw new Error('Falta la descripción.');
      if (un === 'M2' && !(rend > 0)) throw new Error('Indica los m² por caja.');
      const ex = db.prodApp.find(p => p.codigo === c);
      if (ex) Object.assign(ex, { desc: req.descripcion.trim(), rend, unidad: un }); else db.prodApp.push({ codigo: c, desc: req.descripcion.trim(), rend, unidad: un });
      return { ok: true, producto: { codigo: c, desc: req.descripcion.trim(), rend, unidad: un, app: true }, actualizado: !!ex };
    },
    guardarUbicacion(req) {
      const a = String(req.acopio), ub = normUbic(req.ubic); if (!/^[12]$/.test(a) || !ub) throw new Error('Acopio o ubicación inválidos.');
      if (req.activa === false && ocupados(a, ub)) return err(`No se puede desactivar: ${ub} tiene pallets.`, 'VALIDACION');
      let x = ubicDe(a, ub); const nueva = !x; const pt = partesUbic(ub);
      if (!x) { x = { acopio: a, ubic: ub, pasillo: pt.pasillo, numero: pt.numero }; db.ubic.push(x); }
      Object.assign(x, { cap: req.cap === '' || req.cap == null ? null : (Math.floor(num(req.cap)) || null), tipo: ['POSICION', 'PISO', 'ZONA'].includes(norm(req.tipo)) ? norm(req.tipo) : 'POSICION', activa: req.activa !== false, obs: req.obs || '' });
      return { ok: true, ubicacion: x, nueva };
    },
    capacidadMasiva(req) {
      let n = 0; const cap = req.cap === '' || req.cap == null ? null : (Math.floor(num(req.cap)) || null);
      for (const x of db.ubic) if (x.acopio === String(req.acopio) && x.pasillo === norm(req.pasillo) && x.tipo === 'POSICION' && (!req.soloSinCapacidad || !x.cap)) { x.cap = cap; n++; }
      return { ok: true, actualizadas: n, ubicaciones: db.ubic };
    },
    crearRango(req) {
      const a = String(req.acopio), pas = norm(req.pasillo), d = Math.floor(num(req.desde)), h = Math.floor(num(req.hasta));
      if (!/^[12]$/.test(a) || !/^[A-Z]$/.test(pas) || h < d) throw new Error('Datos inválidos.');
      let n = 0;
      for (let i = d; i <= h; i++) { const ub = `${pas}-${pad(i, 2)}`; if (ubicDe(a, ub)) continue; db.ubic.push({ acopio: a, ubic: ub, pasillo: pas, numero: i, cap: req.cap ? Math.floor(num(req.cap)) : null, tipo: norm(req.tipo) || 'POSICION', activa: true, obs: '' }); n++; }
      return { ok: true, creadas: n, ubicaciones: db.ubic };
    },
    usuarios() { return { ok: true, usuarios: db.usuarios.map(u => ({ usuario: u.usuario, nombre: u.nombre, rol: u.rol, activo: u.activo, creado: u.creado, ultAcceso: u.ultAcceso })) }; },
    async guardarUsuario(req, yo) {
      const us = String(req.usuario || '').trim().toLowerCase();
      if (!/^[a-z0-9._-]{3,30}$/.test(us)) throw new Error('Usuario inválido: 3 a 30 caracteres.');
      if (us === yo.usuario && (req.rol !== 'ADMIN' || req.activo === false)) throw new Error('No puedes quitarte el rol ADMIN ni desactivarte.');
      let u = db.usuarios.find(x => x.usuario === us);
      if (!u) { if (!req.clavePlana) throw new Error('Define una clave para el usuario nuevo.'); u = { usuario: us, creado: Date.now(), ultAcceso: null }; db.usuarios.push(u); }
      Object.assign(u, { nombre: req.nombre || u.nombre || us, rol: ROLES[req.rol] ? req.rol : 'OPERADOR', activo: req.activo !== false });
      if (req.clavePlana) u.clave = req.clavePlana;
      return { ok: true };
    },
    async cambiarClave(req, u) { if ((await hashClave(u.usuario, u.clave)) !== req.hashActual) return err('La clave actual no es correcta.'); u.clave = req.clavePlana; return { ok: true }; },
  };
  const PERMISOS = { entrada: 'OPERADOR', salida: 'OPERADOR', traslado: 'OPERADOR', crearProducto: 'OPERADOR', ajuste: 'SUPERVISOR', guardarUbicacion: 'SUPERVISOR', capacidadMasiva: 'SUPERVISOR', crearRango: 'SUPERVISOR', usuarios: 'ADMIN', guardarUsuario: 'ADMIN' };

  async function despachar(req) {
    await sleep(160 + Math.random() * 260);
    cargar();
    try {
      if (req.accion === 'login') return await H.login(req);
      const u = usuarioDe(req.token);
      if (!u) return err('Sesión expirada. Vuelve a ingresar.', 'AUTH');
      const h = H[req.accion]; if (!h) return err('Acción desconocida');
      if (PERMISOS[req.accion] && ROLES[u.rol] < ROLES[PERMISOS[req.accion]]) return err(`Tu rol (${u.rol}) no permite esta acción.`, 'PERMISO');
      if (req.opId && db.ops[req.opId]) return Object.assign({ duplicado: true }, db.ops[req.opId]);
      const r = await h(req, u);
      if (r.ok && req.opId) db.ops[req.opId] = { ok: true, ids: r.ids || [] };
      if (r.ok && !['bootstrap', 'productos', 'erp', 'pallet', 'movimientos', 'historial', 'usuarios'].includes(req.accion)) guardar();
      return JSON.parse(JSON.stringify(r));
    } catch (e) { return err(e.message); }
  }
  return { despachar, reiniciar() { store.del(KEY); db = null; } };
})();

/** Modal apilable. Devuelve el elemento .modal */
function modal({ titulo, html, pie = '', ancho = false, onClose } = {}) {
  const bd = document.createElement('div');
  bd.className = 'backdrop';
  bd.innerHTML = `<div class="modal ${ancho ? 'wide' : ''}" role="dialog" aria-modal="true"><div class="m-h"><h3>${titulo}</h3><button class="btn-icon" data-act="cerrarModal" aria-label="Cerrar">${ic('x')}</button></div><div class="m-b">${html}</div>${pie ? `<div class="m-f">${pie}</div>` : ''}</div>`;
  bd._onClose = onClose;
  bd.addEventListener('mousedown', e => { if (e.target === bd) cerrarModal(bd); });
  $('#modales').appendChild(bd);
  document.body.style.overflow = 'hidden';
  return bd.querySelector('.modal');
}
function cerrarModal(bd) {
  bd = bd || $$('#modales .backdrop').pop();
  if (!bd) return;
  const cb = bd._onClose; bd.remove();
  if (!$('#modales .backdrop')) document.body.style.overflow = '';
  if (cb) cb();
}
function cerrarModales() { while ($('#modales .backdrop')) cerrarModal(); }
function confirmar(msg, { ok = 'Confirmar', peligro = false, titulo = 'Confirmar' } = {}) {
  return new Promise(res => {
    let resp = false;
    const m = modal({ titulo, html: `<p style="margin:0;font-size:16px">${msg}</p>`, pie: `<button class="btn" data-x="no">Cancelar</button><button class="btn ${peligro ? 'btn-danger' : 'btn-primary'}" data-x="si">${ok}</button>`, onClose: () => res(resp) });
    m.querySelector('[data-x=no]').onclick = () => cerrarModal();
    m.querySelector('[data-x=si]').onclick = () => { resp = true; cerrarModal(); };
  });
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modales .backdrop') && $('#scanner').hidden) cerrarModal(); });

function resultados(q) {
  const Q = norm(q);
  if (!Q) return { items: [], vacio: true };
  if (/^PL\d{6}$/.test(Q) || /^TMP-/.test(Q)) return { tipo: 'pallet', id: Q, items: [] };
  const qq = sinTildes(Q), toks = qq.split(/\s+/).filter(Boolean);
  const puntaje = (c, k) => { if (c === Q) return 100; if (c.startsWith(Q)) return 60; if (c.includes(Q)) return 40; return toks.every(t => k.includes(t)) ? 20 : 0; };
  const out = [], vistos = new Set();
  for (const [c, arr] of S.idx.porCodigo) {
    const s = puntaje(c, sinTildes(`${c} ${arr[0].desc}`.toUpperCase()));
    if (s) { out.push({ c, d: arr[0].desc, s: s + 5, stock: true }); vistos.add(c); }
  }
  for (const p of S.prodList) {
    if (vistos.has(p.c)) continue;
    const s = puntaje(p.c, p.k);
    if (s) out.push({ c: p.c, d: p.d, s });
    if (out.length > 500) break;
  }
  out.sort((a, b) => b.s - a.s || (b.stock ? 1 : 0) - (a.stock ? 1 : 0) || a.c.localeCompare(b.c));
  const exacto = (S.idx.porCodigo.has(Q) || S.prod.has(Q)) ? Q : null;
  return { items: out.slice(0, 40), exacto, total: out.length };
}

function itemResultado(c, d) {
  const R = resumenCodigo(c);
  const lado = R.pallets
    ? `<b>${R.pallets} pal</b><small>${fmtCant(R.cant, R.unidad)}</small>`
    : `<small class="mut">sin stock en acopio</small>`;
  return `<button class="ri" data-act="ficha" data-c="${esc(c)}"><div class="ri-main"><span class="code">${esc(c)}</span><span class="ri-d">${esc(d || '')}</span></div><div class="ri-side">${lado}</div></button>`;
}

function pintarResultados() {
  const box = $('#q-res'); if (!box) return;
  const r = resultados(S.q);
  if (r.vacio) {
    const top = [...S.idx.porCodigo.entries()].map(([c, arr]) => ({ c, d: arr[0].desc, n: arr.length })).sort((a, b) => b.n - a.n).slice(0, 10);
    const recientes = store.get('lim_recientes', []).filter(c => S.idx.porCodigo.has(c) || S.prod.has(c)).slice(0, 8);
    box.innerHTML = (recientes.length ? `<div class="sec-t">Consultados recientemente</div><div class="chips">${recientes.map(c => `<button class="chip" data-act="ficha" data-c="${esc(c)}"><b>${esc(c)}</b></button>`).join('')}</div>` : '') +
      `<div class="sec-t">Más pallets en acopio</div>${top.map(x => itemResultado(x.c, x.d)).join('') || '<div class="empty">Sin pallets cargados todavía.</div>'}`;
    return;
  }
  if (r.tipo === 'pallet') { box.innerHTML = `<button class="ri" data-act="pallet" data-id="${esc(r.id)}"><div class="ri-main"><span class="code">${esc(r.id)}</span><span class="ri-d">Abrir pallet</span></div>${ic('box')}</button>`; return; }
  box.innerHTML = r.items.length
    ? r.items.map(x => itemResultado(x.c, x.d)).join('') + (r.total > r.items.length ? `<p class="mut" style="text-align:center;font-size:13px">${r.total - r.items.length} resultados más: afina la búsqueda</p>` : '')
    : `<div class="empty">Sin resultados para “${esc(S.q)}”.${S.prodList.length ? '' : '<br>El catálogo aún se está cargando.'}</div>`;
}

  const ps = (S.idx.porCodigo.get(codigo) || []).slice();

  // tono / calibre
  const tc = {};
  for (const p of ps) {
    const k = `${p.tono}|${p.calibre}`;
    const x = tc[k] || (tc[k] = { tono: p.tono, cal: p.calibre, pallets: 0, cajas: 0, cant: 0, ubs: new Set() });
    x.pallets++; x.cajas += p.cajas; x.cant += p.unidad === 'UN' ? p.cajas : p.mts; x.ubs.add(`A${p.acopio} ${p.ubic}`);
  }

  const grupos = {};

      ${R.pallets ? `<button class="btn btn-sm" data-act="irMapa" data-a="${ps[0].acopio}" data-c="${esc(codigo)}">${ic('grid', 18)} Mapa</button>` : ''}</div></div>
    <div class="ficha-h"><div style="min-width:0">
      <span class="code">${esc(codigo)}</span>
      <div class="desc">${esc(info ? info.d : 'Código sin descripción en el maestro')}</div>
      <div class="meta">${un === 'UN' ? '<span class="badge b-un">UNIDADES</span>' : `<span>Rendimiento <b>${info && info.r ? fmtN(info.r, 2) : '—'} m²/caja</b></span>`}
        <span id="f-pick">Picking <b>${S.erp[codigo] ? esc(S.erp[codigo][2] || '—') : '…'}</b></span></div>
    </div></div>
    <div class="kgrid k3">
      ${kpi('En acopio', R.pallets ? (un === 'UN' ? `${fmtN(R.cant)}<small>un</small>` : `${fmtN(R.cant, 2)}<small>m²</small>`) : '0', R.pallets ? `${fmtN(R.cajas)} ${unidadTxt(un)} · ${R.pallets} pallet${R.pallets > 1 ? 's' : ''}` : 'Sin pallets en acopio', 'acc')}
      ${['1', '2'].map(a => { const x = R.ac[a]; return kpi(`Acopio ${a}`, x.pallets ? (un === 'UN' ? `${fmtN(x.cant)}<small>un</small>` : `${fmtN(x.cant, 2)}<small>m²</small>`) : '—', x.pallets ? `${fmtN(x.cajas)} ${unidadTxt(un)} · ${x.pallets} pal` : 'sin pallets'); }).join('')}
    </div>
    <div id="f-erp">${bloqueERP(codigo, R, un, info)}</div>
    <div id="f-rot"></div>
    ${R.pallets ? `
    <section class="card"><div class="card-h"><h2 class="h2">Tono y calibre</h2><span class="mut" style="font-size:13px">mismo tono = mismo lote de fabricación</span></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tono</th><th>Calibre</th><th class="n">Pallets</th><th class="n">${un === 'UN' ? 'Unid.' : 'Cajas'}</th>${un === 'UN' ? '' : '<th class="n">m²</th>'}<th>Dónde</th></tr></thead><tbody>
      ${Object.values(tc).sort((a, b) => b.cant - a.cant).map(x => `<tr><td class="code">${esc(x.tono || '—')}</td><td class="code">${esc(x.cal || '—')}</td><td class="n">${x.pallets}</td><td class="n">${fmtN(x.cajas)}</td>${un === 'UN' ? '' : `<td class="n">${fmtN(x.cant, 2)}</td>`}<td style="font-size:13px;color:var(--tx2)">${[...x.ubs].slice(0, 6).join(' · ')}${x.ubs.size > 6 ? ' …' : ''}</td></tr>`).join('')}

function bloqueERP(codigo, R, un, info) {
  if (!(codigo in S.erp)) return `<div class="kgrid k3">${kpi('Físico ERP', '…')}${kpi('Disponible ERP', '…')}${kpi('Fuera de acopio', '…')}</div>`;
  const e = S.erp[codigo];
  if (!e) return `<div class="note warn">${ic('alert')}<div><b>No registra en el export del ERP</b> (hoja “fisico”). Revisa el código o actualiza el export.</div></div>`;
  const [disp, fis] = e;
  const fuera = r2(fis - R.cant);
  const cajasFuera = un !== 'UN' && info && info.r ? fuera / info.r : null;
  let alerta = '';
  if (fuera < -0.01) alerta = `<div class="note bad">${ic('alert')}<div><b>Descuadre:</b> el acopio registra ${fmtCant(-fuera, un)} más que el físico del ERP. Antes de asumir error de sistema, revisa: export de “fisico” desactualizado, pallets despachados sin registrar la salida, o conteo de cajas distinto al real.</div></div>`;
  return `<div class="kgrid k3">
    ${kpi('Físico ERP', un === 'UN' ? `${fmtN(fis)}<small>un</small>` : `${fmtN(fis, 2)}<small>m²</small>`, 'export hoja “fisico”')}
    ${kpi('Disponible ERP', un === 'UN' ? `${fmtN(disp)}<small>un</small>` : `${fmtN(disp, 2)}<small>m²</small>`, 'DIS')}
    ${kpi('Fuera de acopio', un === 'UN' ? `${fmtN(fuera)}<small>un</small>` : `${fmtN(fuera, 2)}<small>m²</small>`, cajasFuera != null ? `≈ ${fmtN(cajasFuera, 1)} cajas en picking/sala` : 'picking / sala de ventas', fuera < -0.01 ? 'bad' : '')}
  </div>${alerta}`;
}

async function cargarERP(codigo, R, un, info) {
  try {
    const r = await api('erp', { codigo });
    if (!r.ok) return;
    S.erp[codigo] = r.erp;
    if (S.ficha !== codigo) return;
    const box = $('#f-erp'); if (box) box.innerHTML = bloqueERP(codigo, R, un, info);
    const pk = $('#f-pick'); if (pk) pk.innerHTML = `Picking <b>${esc(r.erp ? r.erp[2] || '—' : '—')}</b>`;
  } catch (e) { const box = $('#f-erp'); if (box) box.innerHTML = `<div class="note warn">${ic('alert')}<div>No se pudo consultar el ERP: ${esc(e.message)}</div></div>`; }
}

async function cargarHistorialCodigo(codigo, R, un) {
  let movs;
  try {
    const r = await api('historial', { codigo, dias: CONFIG.DIAS_HISTORIAL });
    if (!r.ok) throw new Error(r.error);
    movs = r.movs;
  } catch (e) { const b = $('#f-hist'); if (b) b.innerHTML = `<div class="empty">No se pudo cargar el historial: ${esc(e.message)}</div>`; return; }
  if (S.ficha !== codigo) return;
  const sal = movs.filter(m => m.tipo.startsWith('SALIDA'));
  const cant = m => (m.unidad === 'UN' ? m.cajas : m.mts);
  const totSal = sal.reduce((a, m) => a + cant(m), 0);
  const primera = movs.length ? Math.min(...movs.map(m => m.fecha)) : Date.now();
  const diasBase = Math.max(7, Math.min(CONFIG.DIAS_HISTORIAL, Math.ceil((Date.now() - primera) / DIA)));
  const porDia = totSal / diasBase;
  const cobertura = porDia > 0 ? R.cant / porDia : null;
  const rot = $('#f-rot');
  if (rot) rot.innerHTML = `<div class="kgrid k3">
    ${kpi(`Salidas ${diasBase} días`, `${sal.length}<small>mov.</small>`, un === 'UN' ? `${fmtN(totSal)} un` : `${fmtN(totSal, 2)} m²`)}
    ${kpi('Promedio semanal', un === 'UN' ? `${fmtN(porDia * 7)}<small>un</small>` : `${fmtN(porDia * 7, 1)}<small>m²</small>`, 'salidas desde acopio')}
    ${kpi('Cobertura acopio', cobertura == null ? (R.pallets ? 'Sin rotación' : '—') : `${fmtN(cobertura)}<small>días</small>`, cobertura == null ? (R.pallets ? 'stock sin salidas en el período' : 'sin stock') : 'al ritmo actual de salida', cobertura == null && R.pallets ? 'warn' : (cobertura != null && cobertura < 7 ? 'warn' : ''))}
  </div>`;
  const box = $('#f-hist'); if (!box) return;
  if (!movs.length) { box.innerHTML = '<div class="empty">Sin movimientos en el período.</div>'; return; }
  // 13 semanas
  const semanas = [], hoy = inicioDia();
  for (let i = 12; i >= 0; i--) semanas.push({ ini: hoy - (i * 7 + 6) * DIA, fin: hoy - i * 7 * DIA + DIA - 1, e: 0, s: 0 });
  for (const m of movs) {
    const w = semanas.find(x => m.fecha >= x.ini && m.fecha <= x.fin); if (!w) continue;
    if (m.tipo === 'ENTRADA') w.e += cant(m); else if (m.tipo.startsWith('SALIDA')) w.s += cant(m);
  }
  box.innerHTML = `<div class="chart-box"><canvas id="ch-ficha"></canvas></div>
    <div class="tbl-wrap" style="margin-top:14px"><table class="tbl"><thead><tr><th>Fecha y hora</th><th>Tipo</th><th>Pallet</th><th class="n">${un === 'UN' ? 'Unid.' : 'Cajas'}</th><th>Desde → hacia</th><th>Gruero</th></tr></thead><tbody>
    ${movs.slice().reverse().slice(0, 12).map(m => `<tr><td class="nowrap">${m.hist ? fF(m.fecha) + ' <span class="mut">s/h</span>' : fFH(m.fecha)}</td><td>${badgeTipo(m.tipo)}</td><td class="code" style="font-size:12.5px">${esc(m.pallet || '—')}</td><td class="n">${fmtN(m.cajas)}</td><td style="font-size:13px">${esc(rutaMov(m))}</td><td style="font-size:13px">${esc(m.gruero || '')}</td></tr>`).join('')}
    </tbody></table></div>`;
  try {
    await cargarCharts();
    if (!$('#ch-ficha')) return;
    nuevoChart('ch-ficha', {
      type: 'bar',
      data: { labels: semanas.map(w => fDM(w.ini)), datasets: [
        { label: 'Entradas', data: semanas.map(w => r2(w.e)), backgroundColor: CONFIG.COLORES.ENTRADA, borderRadius: 4 },
        { label: 'Salidas', data: semanas.map(w => r2(w.s)), backgroundColor: CONFIG.COLORES.SALIDA, borderRadius: 4 },
      ] },
      options: { plugins: { title: { display: true, text: `${un === 'UN' ? 'Unidades' : 'm²'} por semana`, align: 'start', color: '#B6C6BD' }, datalabels: { formatter: v => (v ? fmtN(v) : ''), font: { size: 10 } } }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true, grace: '12%' } } },
    });
  } catch (e) { /* sin gráfico si no hay CDN */ }
}
const rutaMov = m => {
  const o = m.ubiOrig ? `${m.acoOrig ? 'A' + m.acoOrig + ' ' : ''}${m.ubiOrig}` : '';
  const d = m.ubiDest ? `A${m.acoDest} ${m.ubiDest}` : (m.destino ? `${m.destino}${m.detalle ? ' ' + m.detalle : ''}` : '');
  return [o, d].filter(Boolean).join(' → ') || '—';
};

      const r = await api('pallet', { id });
      if (!r.ok) { toast(r.error || 'Pallet no encontrado', 'err'); beep(false); return; }
      p = r.pallet; if (!r.activo) cierre = r.cierre || {};
    } catch (e) { toast(e.message, 'err'); return; }
  }
  const e = edadDias(p.fIngreso);
  const u = S.idx.ubic.get(ubicKey(p.acopio, p.ubic));

        <div style="color:var(--tx2);margin-top:4px">${esc(p.desc)}</div>
        <div class="meta"><span>Ingreso <b>${p.fIngreso ? fFH(p.fIngreso) : 's/f'}</b></span>${e != null ? `<span><b>${e}</b> días</span>` : ''}${p.uIngreso ? `<span>por <b>${esc(p.uIngreso)}</b></span>` : ''}</div>

      </div>
      ${p.obs ? `<p class="note" style="margin-top:12px">${esc(p.obs)}</p>` : ''}
      ${opera ? `<div class="p-acts">
        <button class="btn btn-primary" data-act="palSalida" data-id="${esc(p.id)}">${ic('out')} Salida total</button>
        <button class="btn" data-act="palParcial" data-id="${esc(p.id)}">Salida parcial</button>

// ============================ SUGERENCIA DE UBICACIONES ============================
/** Prioriza: 1) posiciones con el mismo código (y tono) y espacio; 2) posiciones libres; 3) posiciones con espacio. */
function sugerirUbic(acopio, codigo, tono, n = 1) {
  const res = [];
  const lista = S.ubic.filter(u => u.acopio === acopio && u.activa && u.tipo !== 'ZONA');
  for (const u of lista) {
    const e = estadoUbic(u);
    const ps = S.idx.porUbic.get(ubicKey(u.acopio, u.ubic)) || [];
    const mismo = codigo ? ps.filter(p => p.codigo === codigo) : [];
    const mismoTono = mismo.filter(p => !tono || p.tono === norm(tono));
    const cabe = e.cap ? e.libres >= n : e.n === 0;
    let score = 0, motivo = '';
    if (mismoTono.length && cabe) { score = 300 + mismoTono.length; motivo = 'mismo código' + (tono ? ' y tono' : ''); }
    else if (mismo.length && cabe) { score = 250; motivo = 'mismo código'; }
    else if (e.n === 0) { score = 200 - u.numero / 1000; motivo = 'libre'; }
    else if (e.cap && e.libres >= n) { score = 150 + e.libres; motivo = 'con espacio'; }
    if (score) res.push({ u, e, score, motivo });
  }
  return res.sort((a, b) => b.score - a.score).slice(0, 8);
}

function textoEstadoUbic(acopio, ubic, n) {
  const ub = normUbic(ubic);
  if (!ub) return '';
  const u = S.idx.ubic.get(ubicKey(acopio, ub));
  if (!u) return `<span style="color:var(--amber)">${ic('alert', 16)} ${esc(ub)} no existe en Acopio ${acopio}${puede('SUPERVISOR') ? ' (se puede crear al registrar)' : ''}.</span>`;
  if (!u.activa) return `<span style="color:var(--red)">${esc(ub)} está inactiva.</span>`;
  const e = estadoUbic(u);
  if (!e.cap) return `<span class="mut">${esc(ub)}: ${e.n ? `${e.n} pallet(s) hoy, sin capacidad definida` : 'libre, sin capacidad definida'}.</span>`;
  const desp = e.n + n;
  if (desp > e.cap) return `<span style="color:var(--red)">${ic('alert', 16)} ${esc(ub)} tiene ${e.n}/${e.cap}: con ${n} más queda en ${desp}/${e.cap} (sobre capacidad).</span>`;
  return `<span style="color:var(--brand)">${ic('check', 16)} ${esc(ub)} tiene ${e.n}/${e.cap} → quedaría ${desp}/${e.cap}.</span>`;
}

    if (datos.producto && !r.encolado) { const o = { c: codigo, d: datos.producto.descripcion, r: datos.producto.rendimiento, u: datos.producto.unidad, a: 1, k: sinTildes(`${codigo} ${datos.producto.descripcion}`.toUpperCase()) }; S.prod.set(codigo, o); S.prodList.push(o); }
    if (r.duplicado) cargarDatos({ silencioso: true });

        <p>${r.encolado ? 'Se enviará sola al volver la red. Las etiquetas se imprimen cuando tenga ID definitivo.' : `${fFH(r.fecha)} · ${esc(codigo)}${r.excedida ? ' · <b style="color:var(--amber)">quedó sobre capacidad</b>' : ''}`}</p></div>

    });

/** Autocompletado de productos sobre un input. */
function autocompletar(inp, lista, onSel, onEnter) {
  if (!inp) return;
  let sel = -1, items = [];
  const pintar = () => {
    const q = inp.value.trim();
    if (q.length < 2) { lista.hidden = true; return; }
    items = resultados(q).items.slice(0, 12);
    if (!items.length) { lista.hidden = true; return; }
    lista.innerHTML = items.map((x, i) => `<button type="button" class="${i === sel ? 'sel' : ''}" data-c="${esc(x.c)}"><span class="code">${esc(x.c)}</span><span>${esc(x.d)}</span></button>`).join('');
    lista.hidden = false;
  };
  inp.addEventListener('input', debounce(() => { sel = -1; pintar(); }, 90));
  inp.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowDown') { sel = Math.min(items.length - 1, sel + 1); pintar(); ev.preventDefault(); }
    else if (ev.key === 'ArrowUp') { sel = Math.max(-1, sel - 1); pintar(); ev.preventDefault(); }
    else if (ev.key === 'Enter') { ev.preventDefault(); lista.hidden = true; if (sel >= 0 && items[sel]) onSel(items[sel].c); else if (inp.value.trim()) onEnter(inp.value.trim()); }
    else if (ev.key === 'Escape') lista.hidden = true;
  });
  inp.addEventListener('blur', () => setTimeout(() => { lista.hidden = true; }, 180));
  lista.addEventListener('mousedown', ev => { const b = ev.target.closest('button[data-c]'); if (b) { ev.preventDefault(); lista.hidden = true; onSel(b.dataset.c); } });
}

// ============================ LOTE DE SALIDA ============================
const guardarLote = () => { store.set('lim_lote', S.lote); pintarNav(); };
function loteAgregar(id, { silencioso = false } = {}) {
  id = norm(id);
  const p = S.idx.porId.get(id);
  if (!p) { if (!silencioso) { toast(`${id} no está en acopio`, 'err'); beep(false); } return false; }
  if (p.tmp) { toast('Ese pallet aún no se sincroniza', 'warn'); return false; }
  if (S.lote.some(x => x.id === id)) { if (!silencioso) toast(`${id} ya está en el lote`, 'warn'); return false; }
  S.lote.push({ id, cajas: p.cajas });
  guardarLote();
  if (!silencioso) toast(`${id} agregado · ${S.lote.length} en el lote`);
  return true;
}

    </section>
    <section class="card">
      <div class="card-h"><h2 class="h2">Lote <span class="badge b-sal" style="margin-left:6px">${S.lote.length}</span></h2>${S.lote.length ? '<button class="btn btn-ghost btn-sm" data-act="loteVaciar">Vaciar</button>' : ''}</div>
      ${invalidas ? `<div class="note bad">${ic('alert')}<div>${invalidas} pallet(s) del lote ya no están en acopio (otro usuario los movió). Quítalos para continuar.</div></div>` : ''}
      ${lineas.length ? lineas.map(lineaLote).join('') : `<div class="empty">${ic('box', 28)}<br>Lote vacío. Escanea pallets o agrégalos por código.</div>`}

function lineaLote({ x, p }) {

function setCajasLote(id, v) {

ACT.llMenos = el => { const x = S.lote.find(l => l.id === el.dataset.id); if (x) { setCajasLote(x.id, num(x.cajas) - 1); vSalida(); } };

function salAgregarTexto(txt) {
  const Q = norm(txt);
  if (/^PL\d{6}$/.test(Q)) { if (loteAgregar(Q)) { beep(); vSalida(); } return; }
  if (S.idx.porCodigo.has(Q)) return elegirPalletsDe(Q);
  const r = resultados(Q);
  if (r.items.length && r.items[0].stock) return elegirPalletsDe(r.items[0].c);
  toast(`No hay pallets en acopio para “${txt}”`, 'warn');
}

/** Selector de pallets de un código, ordenado FIFO (más antiguo primero). */
function elegirPalletsDe(codigo) {
  const ps = (S.idx.porCodigo.get(codigo) || []).filter(p => !p.tmp).slice().sort((a, b) => (a.fIngreso || 0) - (b.fIngreso || 0) || a.ubic.localeCompare(b.ubic));
  if (!ps.length) return toast(`No hay pallets de ${codigo} en acopio`, 'warn');
  const enLote = new Set(S.lote.map(x => x.id));
  const tonos = [...new Set(ps.map(p => p.tono || '—'))];
  let filtroTono = '';
  const m = modal({
    titulo: `Pallets de <span class="code">${esc(codigo)}</span>`, ancho: true,
    html: `<p class="sub" style="margin:0 0 12px">${esc(ps[0].desc)} · ordenados del más antiguo al más nuevo (FIFO).</p>
      ${tonos.length > 1 ? `<div class="chips" id="ep-tonos" style="margin-bottom:12px"><button class="chip on" data-t="">Todos los tonos</button>${tonos.map(t => `<button class="chip" data-t="${esc(t)}">Tono <b>${esc(t)}</b></button>`).join('')}</div>` : ''}
      <div class="etq-list" id="ep-list">${ps.map(p => `<label class="etq-row" data-tono="${esc(p.tono || '—')}"><input type="checkbox" value="${esc(p.id)}" ${enLote.has(p.id) ? 'checked disabled' : ''}>
        <span class="code">${esc(p.id)}</span><span class="d">A${esc(p.acopio)} · <b>${esc(p.ubic)}</b> · T ${esc(p.tono || '—')} · C ${esc(p.calibre || '—')} · ${p.fIngreso ? fF(p.fIngreso) : 's/f'}</span><b class="mono">${fmtN(p.cajas)} ${p.unidad === 'UN' ? 'un' : 'cj'}</b></label>`).join('')}</div>`,
    pie: `<button class="btn" data-act="cerrarModal">Cancelar</button><button class="btn btn-primary" id="ep-ok">Agregar al lote</button>`,
  });
  const tb = $('#ep-tonos', m);
  if (tb) tb.addEventListener('click', ev => { const c = ev.target.closest('[data-t]'); if (!c) return; filtroTono = c.dataset.t; $$('.chip', tb).forEach(x => x.classList.toggle('on', x === c)); $$('#ep-list .etq-row', m).forEach(r => { r.hidden = filtroTono && r.dataset.tono !== filtroTono; }); });
  $('#ep-ok', m).onclick = () => {
    const ids = $$('#ep-list input:checked:not(:disabled)', m).filter(i => !i.closest('.etq-row').hidden).map(i => i.value);
    if (!ids.length) return toast('Marca al menos un pallet', 'warn');
    ids.forEach(id => loteAgregar(id, { silencioso: true }));
    cerrarModales(); toast(`${ids.length} pallet(s) agregados al lote`);
    if (S.vista === 'salida') vSalida(); else ir('salida');
  };
}

async function salConfirmar() {
  const lineas = S.lote.map(x => ({ x, p: S.idx.porId.get(x.id) }));
  if (!lineas.length) return;
  if (lineas.some(l => !l.p)) return toast('Hay pallets que ya no están en acopio', 'err');
  const d = S.sal;
  const items = lineas.map(({ x, p }) => ({ id: p.id, cajas: num(x.cajas) >= p.cajas ? null : num(x.cajas), detalle: d.detalle || (d.destino === 'PICKING' && S.erp[p.codigo] ? S.erp[p.codigo][2] : '') }));
  const snapshot = lineas.map(({ x, p }) => ({ id: p.id, codigo: p.codigo, desc: p.desc, tono: p.tono, calibre: p.calibre, unidad: p.unidad, cajas: num(x.cajas), mts: p.unidad === 'UN' ? 0 : r2(num(x.cajas) * p.rend), acopio: p.acopio, ubic: p.ubic, total: num(x.cajas) >= p.cajas }));
  const b = $('#sal-ok'); b && b.classList.add('busy');
  let r;
  try { r = await operar('salida', { items, destino: d.destino, detalle: d.detalle, gruero: d.gruero || (S.user ? norm(S.user.nombre) : ''), obs: d.obs }); }
  catch (e) { toast(e.message, 'err'); return; } finally { b && b.classList.remove('busy'); }
  if (!r.ok) { toast(r.error || 'No se pudo registrar la salida', 'err', 7000); beep(false); return; }
  if (!r.encolado && !r.duplicado) aplicarResultado(r);
  if (r.duplicado) cargarDatos({ silencioso: true });
  const comp = { fecha: r.fecha || Date.now(), lineas: snapshot, destino: d.destino, detalle: d.detalle, gruero: d.gruero || (S.user ? norm(S.user.nombre) : ''), usuario: S.user ? S.user.usuario : '', obs: d.obs, liberadas: r.liberadas || [], pendiente: !!r.encolado };
  S.ultimoComprobante = comp;
  S.lote = []; guardarLote(); S.sal.detalle = ''; S.sal.obs = '';
  vSalida(); vibrar([30, 40, 30]);
  const tot = snapshot.reduce((a, l) => { a.cj += l.cajas; a.m2 += l.mts; return a; }, { cj: 0, m2: 0 });
  modal({
    titulo: 'Salida registrada',
    html: `<div class="ok-big"><div class="ic-ok">${ic(r.encolado ? 'clock' : 'check', 34)}</div><h4>${snapshot.length} pallet${snapshot.length > 1 ? 's' : ''} · ${fmtN(tot.cj)} cj${tot.m2 ? ` · ${fmtN(tot.m2, 2)} m²` : ''}</h4>
      <p>${r.encolado ? 'Guardada sin conexión: se envía sola al volver la red.' : `${fFH(comp.fecha)} · ${esc(comp.destino)} · ${esc(comp.gruero)}`}</p></div>
      ${comp.liberadas.length ? `<div class="sec-t" style="text-align:center">Posiciones que quedaron libres</div><div class="libres">${comp.liberadas.map(l => `<span class="cell st-libre" style="height:40px;padding:0 12px;flex-direction:row;gap:6px"><b>${esc(l.ubic)}</b><small>A${esc(l.acopio)}</small></span>`).join('')}</div>` : ''}`,
    pie: `<button class="btn" data-act="cerrarModal">Cerrar</button><button class="btn" data-act="verPlanillaHoy">${ic('list')} Planilla de hoy</button><button class="btn btn-primary" data-act="imprimirComprobante">${ic('print')} Comprobante</button>`,
  });
}
ACT.salConfirmar = () => salConfirmar();
ACT.verPlanillaHoy = () => { S.movs.preset = 'hoy'; S.movs.tipo = 'SALIDA'; S.movs.rows = null; ir('movs'); };

function abrirTraslado(ids) {
  const ps = ids.map(id => S.idx.porId.get(id)).filter(p => p && !p.tmp);
  if (!ps.length) return toast('No hay pallets válidos para trasladar', 'warn');
  const T = { acopio: ps[0].acopio, ubic: '', gruero: '', obs: '' };
  cerrarModales();
  const m = modal({
    titulo: `Trasladar ${ps.length} pallet${ps.length > 1 ? 's' : ''}`,

      <div class="field">Acopio destino<div class="seg big" id="tr-ac">${['1', '2'].map(a => `<button class="${T.acopio === a ? 'on' : ''}" data-a="${a}">Acopio ${a}</button>`).join('')}</div></div>
      <div style="display:flex;gap:8px;margin-top:12px"><input id="tr-ub" placeholder="Ubicación destino (ej: B-04)" autocapitalize="characters" style="font:700 18px var(--f-m)">
        <button class="btn-icon" id="tr-scan" aria-label="Escanear">${ic('scan')}</button><button class="btn" id="tr-mapa">${ic('grid', 18)} Mapa</button></div>
      <div class="ubic-st" id="tr-st"></div><div class="sug" id="tr-sug"></div>
      <div class="row2" style="margin-top:12px"><label class="field">Gruero<select id="tr-gru">${opcionesGruero('')}</select></label><label class="field">Observación<input id="tr-obs"></label></div>`,
    pie: `<button class="btn" data-act="cerrarModal">Cancelar</button><button class="btn btn-primary" id="tr-ok">${ic('move')} Trasladar</button>`,
  });
  const pintar = () => {
    $('#tr-st', m).innerHTML = textoEstadoUbic(T.acopio, T.ubic, ps.length);
    $('#tr-sug', m).innerHTML = sugerirUbic(T.acopio, ps[0].codigo, ps[0].tono, ps.length).map(s => `<button class="chip ${normUbic(T.ubic) === s.u.ubic ? 'on' : ''}" data-su="${esc(s.u.ubic)}"><b>${esc(s.u.ubic)}</b><small>${s.e.cap ? `${s.e.n}/${s.e.cap}` : s.e.n} · ${s.motivo}</small></button>`).join('');
  };
  pintar();
  $('#tr-ac', m).onclick = ev => { const b = ev.target.closest('[data-a]'); if (!b) return; T.acopio = b.dataset.a; $$('#tr-ac button', m).forEach(x => x.classList.toggle('on', x === b)); pintar(); };
  $('#tr-ub', m).oninput = ev => { T.ubic = ev.target.value; pintar(); };
  $('#tr-sug', m).onclick = ev => { const b = ev.target.closest('[data-su]'); if (!b) return; T.ubic = b.dataset.su; $('#tr-ub', m).value = T.ubic; pintar(); };
  $('#tr-mapa', m).onclick = () => elegirUbic({ acopio: T.acopio, n: ps.length, codigo: ps[0].codigo, onSel: (a, u) => { T.acopio = a; T.ubic = u; $('#tr-ub', m).value = u; $$('#tr-ac button', m).forEach(x => x.classList.toggle('on', x.dataset.a === a)); pintar(); } });
  $('#tr-scan', m).onclick = () => abrirScanner({ titulo: 'Escanear ubicación destino', onCode: txt => { const u = leerQRUbic(txt); if (u) { T.acopio = u.acopio; T.ubic = u.ubic; } else T.ubic = normUbic(txt); $('#tr-ub', m).value = T.ubic; $$('#tr-ac button', m).forEach(x => x.classList.toggle('on', x.dataset.a === T.acopio)); pintar(); } });
  const enviar = async (extra = {}) => {
    const b = $('#tr-ok', m);
    if (!normUbic(T.ubic)) return toast('Indica la ubicación destino', 'warn');
    b.classList.add('busy');
    let r;
    try { r = await operar('traslado', Object.assign({ ids: ps.map(p => p.id), acopio: T.acopio, ubicacion: normUbic(T.ubic), gruero: $('#tr-gru', m).value, obs: $('#tr-obs', m).value, opId: T.opId || (T.opId = uid()) }, extra)); }
    catch (e) { toast(e.message, 'err'); return; } finally { b.classList.remove('busy'); }
    if (r.ok) {
      if (!r.encolado && !r.duplicado) aplicarResultado(r);
      cerrarModales(); renderVista();
      const lib = (r.liberadas || []).map(l => `${l.ubic} (A${l.acopio})`).join(', ');
      toast(r.encolado ? 'Sin conexión: traslado guardado para sincronizar' : `Trasladado a A${T.acopio} ${normUbic(T.ubic)}${lib ? ` · quedó libre ${lib}` : ''}`, r.encolado ? 'warn' : 'ok', 5000);
      return;
    }
    if (r.code === 'CAPACIDAD') { if (await confirmar(`${esc(r.error)}<br><br>¿Trasladar igual?`, { ok: 'Trasladar igual', titulo: 'Capacidad' })) enviar(Object.assign({}, extra, { forzar: true })); }
    else if (r.code === 'UBIC_NO_EXISTE' && puede('SUPERVISOR')) { if (await confirmar(`${esc(r.error)}<br><br>¿Crearla y trasladar?`, { ok: 'Crear y trasladar', titulo: 'Ubicación nueva' })) enviar(Object.assign({}, extra, { crearUbicacion: true })); }
    else toast(r.error || 'No se pudo trasladar', 'err', 6000);
  };
  $('#tr-ok', m).onclick = () => enviar();
}

// ============================ ESCÁNER (QR y códigos de barra) ============================
let _scan = null;
const SCAN = { cb: null, continuo: false, ultimo: '', t: 0, n: 0 };
function leerQRUbic(txt) { const m = String(txt).trim().toUpperCase().match(/^UB\|([12])\|(.+)$/); return m ? { acopio: m[1], ubic: normUbic(m[2]) } : null; }

async function abrirScanner({ titulo = 'Escanear', continuo = false, onCode }) {
  SCAN.cb = onCode; SCAN.continuo = continuo; SCAN.ultimo = ''; SCAN.n = 0;
  $('#scan-titulo').textContent = titulo; $('#scan-count').textContent = ''; $('#scan-msg').textContent = 'Iniciando cámara…'; $('#scan-input').value = '';
  $('#scanner').hidden = false;
  const reader = $('#scan-reader');
  reader.innerHTML = '<div id="scan-cam" style="width:100%;height:100%"></div><div class="scan-frame" id="scan-frame"></div>';
  try {
    await loadScript(CONFIG.CDN.SCANNER);
    const F = window.Html5QrcodeSupportedFormats;
    _scan = new window.Html5Qrcode('scan-cam', { verbose: false, formatsToSupport: F ? [F.QR_CODE, F.CODE_128, F.EAN_13, F.CODE_39, F.EAN_8] : undefined, experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
    await _scan.start({ facingMode: 'environment' }, { fps: 12, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.68); return { width: s, height: s }; }, aspectRatio: window.innerHeight / window.innerWidth }, txt => onScan(txt), () => {});
    $('#scan-msg').textContent = continuo ? 'Escanea uno tras otro · cierra al terminar' : 'Apunta al código';
  } catch (e) {
    $('#scan-msg').textContent = 'Cámara no disponible: escribe el código abajo.';
    console.warn(e);
  }
}
function onScan(txt) {
  txt = String(txt || '').trim(); if (!txt) return;
  const ahora = Date.now();
  if (txt === SCAN.ultimo && ahora - SCAN.t < 2500) return;
  SCAN.ultimo = txt; SCAN.t = ahora; SCAN.n++;
  beep(); vibrar(35);
  const fr = $('#scan-frame'); if (fr) { fr.classList.add('flash'); setTimeout(() => fr.classList.remove('flash'), 220); }
  if (SCAN.continuo) $('#scan-count').textContent = `${SCAN.n} leído${SCAN.n > 1 ? 's' : ''}`;
  const cb = SCAN.cb;

}

function htmlGrid(acopio, { filtro = 'todas', resaltar = '', modo = 'mapa', n = 1 } = {}) {
  const R = norm(resaltar);
  const ubs = S.ubic.filter(u => u.acopio === acopio && (modo === 'mapa' || u.activa));
  if (!ubs.length) return '<div class="empty">Este acopio no tiene ubicaciones cargadas.</div>';
  const grupos = new Map();
  for (const u of ubs) { const g = u.tipo === 'POSICION' ? u.pasillo : 'Otras'; if (!grupos.has(g)) grupos.set(g, []); grupos.get(g).push(u); }
  let html = '';
  for (const [pas, lista] of grupos) {
    const celdas = lista.map(u => {
      const e = estadoUbic(u);
      const ps = R ? (S.idx.porUbic.get(ubicKey(u.acopio, u.ubic)) || []) : [];
      const hit = R && ps.some(p => p.codigo.includes(R) || p.id === R);
      let visible = true;
      if (filtro === 'libre') visible = e.n === 0;
      else if (filtro === 'espacio') visible = e.n === 0 || (e.cap && e.libres > 0);
      else if (filtro === 'llena') visible = e.st === 'llena' || e.st === 'excedida';
      else if (filtro === 'sincap') visible = !e.cap && u.tipo === 'POSICION';
      const cls = ['cell', 'st-' + e.st];
      if (R && !hit) cls.push('dim'); if (hit) cls.push('hit');
      if (!visible) cls.push('dim');
      if (modo === 'sel' && e.cap && e.libres < n) cls.push('nofit');
      if (u.tipo !== 'POSICION') cls.push('wide');
      const pct = e.cap ? Math.min(100, Math.round(100 * e.n / e.cap)) : 0;
      return `<button class="${cls.join(' ')}" data-act="${modo === 'sel' ? 'celdaSel' : 'celda'}" data-k="${esc(ubicKey(u.acopio, u.ubic))}" title="${esc(u.ubic)} · ${ST_TXT[e.st]}${e.cap ? ` ${e.n}/${e.cap}` : ` ${e.n} pallets`}">
        <b>${esc(u.tipo === 'POSICION' ? etiquetaCelda(u) : u.ubic)}</b><small>${e.cap ? `${e.n}/${e.cap}` : (e.n ? e.n : '·')}</small>${e.cap ? `<span class="fill"><i style="width:${pct}%"></i></span>` : ''}</button>`;
    }).join('');
    const est = lista.map(estadoUbic), libres = est.filter(x => x.n === 0).length, pal = est.reduce((a, x) => a + x.n, 0);
    html += `<div class="pasillo"><div class="pas-h"><b>${pas === 'Otras' ? 'Piso y zonas' : 'Pasillo ' + esc(pas)}</b><span>${lista.length} posiciones · ${libres} libre${libres === 1 ? '' : 's'} · ${pal} pallets</span></div><div class="cells">${celdas}</div></div>`;
  }
  return html;
}

const PRESETS = { hoy: 'Hoy', ayer: 'Ayer', '7d': '7 días', '30d': '30 días', mes: 'Este mes' };
function aplicarPreset(p) {
  const hoy = inicioDia();
  const M = S.movs; M.preset = p;
  if (p === 'hoy') { M.desde = hoy; M.hasta = hoy; }
  else if (p === 'ayer') { M.desde = hoy - DIA; M.hasta = hoy - DIA; }
  else if (p === '7d') { M.desde = hoy - 6 * DIA; M.hasta = hoy; }
  else if (p === '30d') { M.desde = hoy - 29 * DIA; M.hasta = hoy; }
  else if (p === 'mes') { const d = new Date(); M.desde = new Date(d.getFullYear(), d.getMonth(), 1).getTime(); M.hasta = hoy; }
}
function vMovs() {
  const M = S.movs, el = $('#v-movs');
  if (!M.desde) aplicarPreset(M.preset || 'hoy');
  el.innerHTML = `
    <div class="vh"><div><div class="eyebrow">Registro con fecha y hora</div><h1 class="h1" style="margin-top:6px">Movimientos</h1>
      <p class="sub">Entradas, salidas, traslados y ajustes. Filtra por <b>Salidas</b> para la planilla de salida de mercadería.</p></div></div>
    <section class="card">
      <div class="chips" style="margin-bottom:12px">${Object.entries(PRESETS).map(([k, t]) => `<button class="chip ${M.preset === k ? 'on' : ''}" data-act="mvPreset" data-p="${k}">${t}</button>`).join('')}</div>
      <div class="row4">

        <label class="field">Hasta<input type="date" id="mv-h" value="${dateInput(M.hasta)}"></label>
        <label class="field">Tipo<select id="mv-t">${[['', 'Todos'], ['ENTRADA', 'Entradas'], ['SALIDA', 'Salidas (total y parcial)'], ['TRASLADO', 'Traslados'], ['AJUSTE', 'Ajustes'], ['SALDO_INICIAL', 'Saldo inicial']].map(([v, t]) => `<option value="${v}" ${M.tipo === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
        <label class="field">Filtrar<input id="mv-q" value="${esc(M.q)}" placeholder="Código, pallet, gruero, ubicación"></label>
      </div>
      <div class="acts" style="margin-top:14px"><button class="btn btn-primary" data-act="mvConsultar">${ic('refresh', 18)} Consultar</button>
        <button class="btn" data-act="mvExcel">${ic('download', 18)} Excel</button><button class="btn" data-act="mvPlanilla">${ic('print', 18)} Imprimir planilla de salida</button></div>
    </section>
    <div id="mv-res">${M.rows ? '' : '<div class="empty">Consultando…</div>'}</div>`;
  $('#mv-t').addEventListener('change', ev => { M.tipo = ev.target.value; pintarMovs(); });
  $('#mv-q').addEventListener('input', debounce(ev => { M.q = ev.target.value; pintarMovs(); }, 150));
  $('#mv-d').addEventListener('change', ev => { M.desde = desdeInput(ev.target.value); M.preset = ''; mvConsultar(); });
  $('#mv-h').addEventListener('change', ev => { M.hasta = desdeInput(ev.target.value); M.preset = ''; mvConsultar(); });
  if (M.rows && M.cargado === `${M.desde}-${M.hasta}`) pintarMovs(); else mvConsultar();
