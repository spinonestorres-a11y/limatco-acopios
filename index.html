async function mvConsultar() {
  const M = S.movs;
  const box = $('#mv-res'); if (box) box.innerHTML = '<div class="empty">Consultando…</div>';
  try {
    const r = await api('movimientos', { desde: M.desde, hasta: M.hasta + DIA - 1 });
    if (!r.ok) throw new Error(r.error);
    M.rows = r.movs.sort((a, b) => b.fecha - a.fecha); M.cargado = `${M.desde}-${M.hasta}`; M.truncado = r.truncado;
    pintarMovs();
  } catch (e) { if (box) box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
function movsFiltrados() {
  const M = S.movs; if (!M.rows) return [];
  const q = sinTildes(norm(M.q));
  return M.rows.filter(m => (!M.tipo || m.tipo.startsWith(M.tipo)) && (!q || sinTildes(norm(`${m.codigo} ${m.pallet} ${m.gruero} ${m.usuario} ${m.ubiOrig} ${m.ubiDest} ${m.detalle} ${m.desc}`)).includes(q)));
}
function pintarMovs() {
  const box = $('#mv-res'); if (!box) return;
  const rows = movsFiltrados();
  const agg = {};
  for (const m of rows) { const t = m.tipo.startsWith('SALIDA') ? 'SALIDA' : m.tipo; const a = agg[t] || (agg[t] = { n: 0, cj: 0, m2: 0 }); a.n++; a.cj += m.cajas; a.m2 += m.unidad === 'UN' ? 0 : m.mts; }

async function cargarCharts() {

  await loadScript(CONFIG.CDN.DATALABELS);

  C.defaults.maintainAspectRatio = false;

  C.defaults.plugins.tooltip.borderColor = '#32443A';

function nuevoChart(id, cfg) {
  if (S.charts[id]) { try { S.charts[id].destroy(); } catch (e) { /* nada */ } }
  const cv = $('#' + id); if (!cv) return null;
  cfg.options = cfg.options || {};

  S.charts[id] = new window.Chart(cv.getContext('2d'), cfg);
  return S.charts[id];
}

function pintarDashCharts() {
  const D = S.dash, rows = D.rows.filter(m => m.tipo !== 'SALDO_INICIAL');
  const C = CONFIG.COLORES;
  // 1) Entradas vs salidas por día (o semana si son 90 días)
  const porSemana = D.dias > 31;
  $('#dash-gran').textContent = porSemana ? 'pallets por semana' : 'pallets por día';
  const buckets = [], hoy = inicioDia();
  if (porSemana) for (let i = Math.ceil(D.dias / 7) - 1; i >= 0; i--) buckets.push({ ini: hoy - (i * 7 + 6) * DIA, fin: hoy - i * 7 * DIA + DIA - 1, e: 0, s: 0 });
  else for (let i = D.dias - 1; i >= 0; i--) buckets.push({ ini: hoy - i * DIA, fin: hoy - i * DIA + DIA - 1, e: 0, s: 0 });
  for (const m of rows) { const b = buckets.find(x => m.fecha >= x.ini && m.fecha <= x.fin); if (!b) continue; if (m.tipo === 'ENTRADA') b.e++; else if (m.tipo.startsWith('SALIDA')) b.s++; }
  nuevoChart('ch-dia', {
    type: 'bar',
    data: { labels: buckets.map(b => fDM(b.ini)), datasets: [
      { label: 'Entradas', data: buckets.map(b => b.e), backgroundColor: C.ENTRADA, borderRadius: 4, maxBarThickness: 22 },
      { label: 'Salidas', data: buckets.map(b => b.s), backgroundColor: C.SALIDA, borderRadius: 4, maxBarThickness: 22 },
    ] },
    options: { plugins: { datalabels: { font: { size: buckets.length > 20 ? 9 : 11 }, rotation: buckets.length > 20 ? -90 : 0, align: buckets.length > 20 ? 'end' : 'end' } }, scales: { x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkip: true } }, y: { beginAtZero: true, grace: '15%', ticks: { precision: 0 } } } },
  });
  // 2) Frecuencia por hora (solo movimientos con hora real)
  const horas = Array(24).fill(0);
  for (const m of rows) if (m.tipo.startsWith('SALIDA') && !m.hist) horas[horaDe(m.fecha)]++;
  let h0 = horas.findIndex(x => x > 0), h1 = 23 - [...horas].reverse().findIndex(x => x > 0);
  if (h0 < 0) { h0 = 8; h1 = 18; }
  h0 = Math.min(h0, 8); h1 = Math.max(h1, 18);
  const maxH = Math.max(...horas);
  nuevoChart('ch-hora', {
    type: 'bar',
    data: { labels: horas.slice(h0, h1 + 1).map((_, i) => `${String(h0 + i).padStart(2, '0')}h`), datasets: [{ label: 'Salidas', data: horas.slice(h0, h1 + 1), backgroundColor: horas.slice(h0, h1 + 1).map(v => (v === maxH && v ? '#FF9F43' : 'rgba(244,183,64,.75)')), borderRadius: 5 }] },
    options: { plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true, grace: '15%', ticks: { precision: 0 } } } },
  });
  // 3) Top productos por m² de salida
  const top = {};
  for (const m of rows) if (m.tipo.startsWith('SALIDA')) { const t = top[m.codigo] || (top[m.codigo] = { c: m.codigo, d: m.desc, m2: 0, n: 0, un: 0 }); t.m2 += m.unidad === 'UN' ? 0 : m.mts; t.un += m.unidad === 'UN' ? m.cajas : 0; t.n++; }
  const t10 = Object.values(top).sort((a, b) => b.m2 - a.m2 || b.un - a.un).slice(0, 10);
  nuevoChart('ch-top', {
    type: 'bar',
    data: { labels: t10.map(x => x.c), datasets: [{ label: 'm²', data: t10.map(x => r2(x.m2)), backgroundColor: t10.map((_, i) => (i < 3 ? C.SALIDA : 'rgba(244,183,64,.55)')), borderRadius: 5 }] },
    options: { indexAxis: 'y', plugins: { legend: { display: false }, tooltip: { callbacks: { title: it => { const x = t10[it[0].dataIndex]; return `${x.c} · ${x.d}`; }, label: it => { const x = t10[it.dataIndex]; return ` ${fmtN(x.m2, 1)} m² · ${x.n} salidas`; } } } },
      scales: { x: { beginAtZero: true, grace: '18%' }, y: { grid: { display: false }, ticks: { font: { family: 'JetBrains Mono, monospace', weight: '700' } } } } },
  });
  // 4) Por gruero (apilado por tipo)
  const gr = {};
  for (const m of rows) { const g = m.gruero || m.usuario || '—'; const x = gr[g] || (gr[g] = { ENTRADA: 0, SALIDA: 0, TRASLADO: 0 }); const t = m.tipo.startsWith('SALIDA') ? 'SALIDA' : m.tipo; if (t in x) x[t]++; }
  const gl = Object.entries(gr).sort((a, b) => (b[1].ENTRADA + b[1].SALIDA + b[1].TRASLADO) - (a[1].ENTRADA + a[1].SALIDA + a[1].TRASLADO)).slice(0, 10);
  nuevoChart('ch-gru', {
    type: 'bar',
    data: { labels: gl.map(x => x[0]), datasets: [['SALIDA', 'Salidas', C.SALIDA], ['ENTRADA', 'Entradas', C.ENTRADA], ['TRASLADO', 'Traslados', C.TRASLADO]].map(([k, l, c]) => ({ label: l, data: gl.map(x => x[1][k]), backgroundColor: c, borderRadius: 3 })) },
    options: { indexAxis: 'y', plugins: { datalabels: { anchor: 'center', align: 'center', color: '#04140D', formatter: v => (v >= 3 ? fmtN(v) : '') } },
      scales: { x: { stacked: true, beginAtZero: true }, y: { stacked: true, grid: { display: false } } } },
  });
  // 5) Ocupación por acopio
  const est = ['1', '2'].map(a => { const r = { libre: 0, parcial: 0, llena: 0, excedida: 0, ocupada: 0 }; S.ubic.filter(u => u.acopio === a && u.tipo === 'POSICION' && u.activa).forEach(u => { r[estadoUbic(u).st]++; }); return r; });
  nuevoChart('ch-ocup', {
    type: 'bar',
    data: { labels: ['Acopio 1', 'Acopio 2'], datasets: [['libre', 'Libres', '#41C68E'], ['parcial', 'Con espacio', '#58A6FF'], ['llena', 'Llenas', '#F4B740'], ['excedida', 'Sobre capacidad', '#FF5F57'], ['ocupada', 'Ocupadas s/cap.', '#71857B']]
      .map(([k, l, c]) => ({ label: l, data: est.map(e => e[k]), backgroundColor: c, borderRadius: 3 })) },
    options: { indexAxis: 'y', plugins: { datalabels: { anchor: 'center', align: 'center', color: '#04140D', formatter: v => (v ? fmtN(v) : '') } }, scales: { x: { stacked: true, beginAtZero: true }, y: { stacked: true, grid: { display: false } } } },
  });
  // 6) Antigüedad
  const tramos = [['0-30', 0, 30], ['31-90', 31, 90], ['91-180', 91, 180], ['181-365', 181, 365], ['+1 año', 366, 1e9]];
  const cnt = tramos.map(() => 0); let sf = 0;
  for (const p of S.pallets) { const e = edadDias(p.fIngreso); if (e == null) { sf++; continue; } const i = tramos.findIndex(t => e >= t[1] && e <= t[2]); if (i >= 0) cnt[i]++; }
  nuevoChart('ch-edad', {
    type: 'bar',
    data: { labels: tramos.map(t => t[0]).concat(['Sin fecha']), datasets: [{ label: 'Pallets', data: cnt.concat([sf]), backgroundColor: ['#41C68E', '#8FD694', '#F4B740', '#FF9F43', '#FF5F57', '#71857B'], borderRadius: 5 }] },
    options: { plugins: { legend: { display: false } }, scales: { x: { grid: { display: false } }, y: { beginAtZero: true, grace: '15%', ticks: { precision: 0 } } } },
  });
}

function qrSVG(texto) {
  if (typeof window.qrcode !== 'function') return `<div style="font:700 12px monospace;color:#000;text-align:center">${esc(texto)}</div>`;
  const q = window.qrcode(0, 'M'); q.addData(String(texto)); q.make();
  const n = q.getModuleCount(); let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
function imprimir(html, pagina) {
  $('#print-area').innerHTML = html;
  let st = $('#print-page');
  if (!st) { st = document.createElement('style'); st.id = 'print-page'; document.head.appendChild(st); }
  st.textContent = `@page { ${pagina} }`;
  document.body.classList.add('printing');
  setTimeout(() => window.print(), 80);
}
window.addEventListener('afterprint', () => document.body.classList.remove('printing'));

    pie: `<button class="btn" data-act="cerrarModal">Cancelar</button><button class="btn btn-primary" id="us-ok">Guardar</button>`,
  });
  $('#us-ok', m).onclick = async ev => {
    const usuario = $('#us-u', m).value.trim().toLowerCase(), clave = $('#us-c', m).value;
    if (nuevo && clave.length < 4) return toast('La clave debe tener al menos 4 caracteres', 'warn');
    const b = ev.currentTarget; b.classList.add('busy');
    try {
      const datos = { usuario, nombre: $('#us-n', m).value.trim(), rol: $('#us-r', m).value, activo: $('#us-a', m).checked };
      if (clave) { datos.hash = await hashClave(usuario, clave); if (DEMO) datos.clavePlana = clave; }
      const r = await api('guardarUsuario', datos);
      if (!r.ok) return toast(r.error, 'err');
      cerrarModales(); toast(nuevo ? 'Usuario creado' : 'Usuario actualizado'); vAdmin();
    } catch (e) { toast(e.message, 'err'); } finally { b.classList.remove('busy'); }
  };
}
ACT.usrNuevo = () => formUsuario(null);
ACT.usrEditar = el => formUsuario(JSON.parse(el.dataset.u));
ACT.cambiarClave = () => {
  cerrarModales();
  const m = modal({
    titulo: 'Cambiar mi clave',
    html: `<div class="stack"><label class="field">Clave actual<input id="cc-a" type="password" autocomplete="current-password"></label><label class="field">Clave nueva<input id="cc-n" type="password" autocomplete="new-password"></label><label class="field">Repetir clave nueva<input id="cc-r" type="password" autocomplete="new-password"></label></div>`,
    pie: `<button class="btn" data-act="cerrarModal">Cancelar</button><button class="btn btn-primary" id="cc-ok">Cambiar</button>`,
  });
  $('#cc-ok', m).onclick = async ev => {
    const a = $('#cc-a', m).value, n = $('#cc-n', m).value;
    if (n.length < 4) return toast('Mínimo 4 caracteres', 'warn');
    if (n !== $('#cc-r', m).value) return toast('Las claves nuevas no coinciden', 'warn');
    const b = ev.currentTarget; b.classList.add('busy');
    try {
      const d = { hashActual: await hashClave(S.user.usuario, a), hashNuevo: await hashClave(S.user.usuario, n) };
      if (DEMO) d.clavePlana = n;
      const r = await api('cambiarClave', d);
      if (!r.ok) return toast(r.error, 'err');
      cerrarModales(); toast('Clave actualizada');
    } catch (e) { toast(e.message, 'err'); } finally { b.classList.remove('busy'); }
  };
};

// ============================ SESIÓN E INICIO ============================
function mostrarLogin(msg = '') {
  $('#app').hidden = true; $('#login').hidden = false;
  $('#demo-hint').hidden = !DEMO;
  $('#login-err').textContent = msg;
  setTimeout(() => { const i = $('#f-login [name=usuario]'); if (i && !i.value) i.focus(); }, 50);
}
function sesionExpirada() {
  if (!S.token) return;
  S.token = null; store.del('lim_ses'); cerrarModales(); cerrarScanner();
  mostrarLogin('Tu sesión expiró. Ingresa de nuevo (lo pendiente se conserva).');
}
async function entrarApp() {
  $('#login').hidden = true; $('#app').hidden = false;
  pintarUsuario(); rutaDesdeHash(); pintarNav(); pintarSync(); renderVista();
  await cargarDatos({ silencioso: !!S.pallets.length });
  if (S.outbox.length) sincronizar();
}
document.addEventListener('submit', async ev => {
  if (ev.target.id !== 'f-login') return;
  ev.preventDefault();
  const f = ev.target, u = f.usuario.value.trim().toLowerCase(), c = f.clave.value, b = $('#btn-login');
  $('#login-err').textContent = ''; b.classList.add('busy');
  try {
    const r = await api('login', { usuario: u, hash: await hashClave(u, c) });
    if (!r.ok) { $('#login-err').textContent = r.error || 'No se pudo ingresar'; return; }
    S.token = r.token; S.user = r.usuario; store.set('lim_ses', { token: S.token, user: S.user });
    f.clave.value = '';
    entrarApp();
  } catch (e) { $('#login-err').textContent = e.message; } finally { b.classList.remove('busy'); }
});
ACT.salir = async () => {
  if (S.outbox.length && !(await confirmar(`Hay ${S.outbox.length} operación(es) sin sincronizar. Quedan guardadas en este equipo y se enviarán cuando vuelvas a ingresar.`, { ok: 'Cerrar sesión' }))) return;
  cerrarModales(); S.token = null; S.user = null; store.del('lim_ses'); store.del('lim_cache'); S.pallets = []; S.ubic = []; reindexar();
  history.replaceState(null, '', location.pathname + location.search); mostrarLogin();
};

function init() {
  if (DEMO) { document.body.classList.add('demo'); $('#demo-banner').hidden = false; }
  const fmt = store.get('lim_fmt'); if (fmt) { S.etq.formato = fmt.p || S.etq.formato; S.etq.formatoUb = fmt.u || S.etq.formatoUb; }
  const prod = store.get('lim_prod'); if (prod && prod.items) setProductos(prod.items, prod.ver);
  const ses = store.get('lim_ses');
  if (ses && tokenVigente(ses.token)) {
    S.token = ses.token; S.user = ses.user;
    const c = store.get('lim_cache');
    if (c && c.pallets) { S.pallets = c.pallets; S.ubic = c.ubic || []; S.erp = c.erp || {}; S.grueros = c.grueros || []; S.ultimaCarga = c.t || 0; for (const o of S.outbox) if (!o.error) aplicarOptimista(o.accion, o.datos); ordenarUbic(); reindexar(); }
    entrarApp();
  } else mostrarLogin();

  setInterval(() => { if (S.token && document.visibilityState === 'visible' && navigator.onLine && Date.now() - S.ultimaCarga > CONFIG.REFRESCO_MS) cargarDatos({ silencioso: true }); }, 30000);
  setInterval(() => { if (S.token && navigator.onLine && S.outbox.some(o => !o.error)) sincronizar(); }, CONFIG.SYNC_MS);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.token && Date.now() - S.ultimaCarga > 60000) cargarDatos({ silencioso: true }); });
  window.addEventListener('online', () => { pintarSync(); toast('Conexión recuperada'); sincronizar(); cargarDatos({ silencioso: true }); });
  window.addEventListener('offline', () => { pintarSync(); toast('Sin conexión: puedes seguir registrando, se sincroniza al volver', 'warn', 5000); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
document.addEventListener('DOMContentLoaded', init);
</script>
